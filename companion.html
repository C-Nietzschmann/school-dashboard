<title>A Level Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@700&display=swap">
<style>
/* The companion to the A Level dashboard: the same tokens, the same subject
   colours, so the two read as one product. The red pen is the one addition —
   it is how marked work has always looked. */
:root{
  --bg:#f7f7f5; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e2e1dc; --line-strong:#cfcec8;
  --text:#0b0b0b; --text-2:#52514e; --muted:#84837c;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --pen:#c8322f; --pen-soft:#fbe7e5; --tick:#1a8a3a; --tick-soft:#e2f3e6; --warn:#a86f00; --warn-soft:#fbf0d9;
  --violet:#7a4fc2; --violet-soft:#efe8fa; --teal:#0f7f86; --teal-soft:#dcf1f2;
  --rule:#e8eef6;
  --radius:12px;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --hand:'Kalam','Bradley Hand','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141413; --surface:#1a1a19; --surface-2:#242422; --line:#302f2c; --line-strong:#43423e;
    --text:#ffffff; --text-2:#c3c2b7; --muted:#8e8d84;
    --accent:#3987e5; --accent-soft:#1c2a3b;
    --pen:#ef6a5f; --pen-soft:#3a1f1c; --tick:#4cc574; --tick-soft:#18301f; --warn:#e0a53a; --warn-soft:#352a15;
    --violet:#a988e8; --violet-soft:#2a2238; --teal:#4cc3c9; --teal-soft:#16302f; --rule:#23262b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141413; --surface:#1a1a19; --surface-2:#242422; --line:#302f2c; --line-strong:#43423e;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#8e8d84;
  --accent:#3987e5; --accent-soft:#1c2a3b;
  --pen:#ef6a5f; --pen-soft:#3a1f1c; --tick:#4cc574; --tick-soft:#18301f; --warn:#e0a53a; --warn-soft:#352a15;
  --violet:#a988e8; --violet-soft:#2a2238; --teal:#4cc3c9; --teal-soft:#16302f; --rule:#23262b;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;
  padding-inline:max(16px, env(safe-area-inset-left, 0px));padding-block:0 calc(84px + env(safe-area-inset-bottom, 0px));overscroll-behavior-y:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ---------- header + tabs ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);
  margin-inline:-16px;padding:calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;border-bottom:1px solid var(--line);transition:transform .22s ease}
header.top.hide{transform:translateY(-105%)}
@media (prefers-reduced-motion: reduce){header.top{transition:none}}
.iconbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;width:32px;height:32px;padding:0;
  display:inline-grid;place-items:center;color:var(--text-2);flex:none}
.iconbtn svg{width:17px;height:17px}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.today-line{flex:1;min-width:0}
.today-line h1{font-size:19px}
.today-line .sub{font-family:var(--mono);font-size:12px;color:var(--text-2);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
@media (min-width:820px){.today-line h1 .short{display:none}}
@media (max-width:819px){
  .top-in{flex-wrap:nowrap;gap:8px}
  .today-line{display:flex;align-items:baseline;gap:8px;min-width:0}
  .today-line h1{font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .today-line h1 .long,.today-line .sub span + span:not(.late){display:none}
  .today-line .sub{font-size:11.5px;white-space:nowrap;overflow:hidden;flex-wrap:nowrap}
  .status{padding:4px 9px;font-size:12px;max-width:46vw}
}
.status{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 11px;
  font-size:12.5px;display:inline-flex;align-items:center;gap:7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status[data-kind="ok"] i{background:var(--tick)}
.status[data-kind="busy"] i{background:var(--accent);animation:pulse 1.2s infinite}
.status[data-kind="waiting"] i{background:var(--warn)}
.status[data-kind="error"] i,.status[data-kind="setup"] i{background:var(--pen)}
@keyframes pulse{50%{opacity:.35}}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom, 0px))}
nav.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 0;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:500}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button[aria-selected="true"]{color:var(--accent)}
nav.tabbar .badge{font-family:var(--mono);font-size:10px;background:var(--pen);color:#fff;border-radius:999px;padding:0 5px;margin-left:3px}
@media (min-width:820px){
  body{padding-bottom:40px}
  nav.tabbar{position:static;display:flex;gap:4px;background:none;border:0;padding:0;order:3;width:100%}
  nav.tabbar button{flex-direction:row;gap:7px;padding:7px 14px;font-size:14px;border-radius:999px}
  nav.tabbar button svg{width:18px;height:18px}
  nav.tabbar button[aria-selected="true"]{background:var(--accent-soft)}
}

main{padding-top:16px}
section.tab{display:none}
section.tab.on{display:block}
.grid2{display:grid;gap:16px}
@media (min-width:820px){.grid2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid2 > *,.stack > *{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h2{font-size:16px}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--pen);border-color:color-mix(in srgb,var(--pen) 45%,var(--line-strong))}
.btn.ghost{border-color:transparent;background:none;color:var(--text-2)}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--c, var(--muted))}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip button{border:0;background:none;padding:0 0 0 2px;color:var(--muted);font-size:14px;line-height:1}
.kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;
  background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.kind.k-test{background:var(--pen-soft);color:var(--pen)}
.kind.k-task{background:var(--accent-soft);color:var(--accent)}
.kind.k-mistakes{background:var(--warn-soft);color:var(--warn)}
.kind.k-current{background:var(--tick-soft);color:var(--tick)}
.kind.k-review{background:var(--violet-soft);color:var(--violet)}
.kind.k-worksheet{background:var(--teal-soft);color:var(--teal)}
.kind.k-notes{background:var(--surface-2);color:var(--text-2)}
.notice{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.notice.bad{border-color:color-mix(in srgb,var(--pen) 40%,var(--line));background:var(--pen-soft)}
.field{display:grid;gap:5px;font-size:13px;color:var(--text-2)}
.field > span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fields{display:grid;gap:12px}
@media (min-width:560px){.fields.two{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13.5px}
.seg button + button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}

/* ---------- today: the day as a timeline ---------- */
.day{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start}
.slot-time{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;padding-top:9px;text-align:right}
.slot-time span{display:block;color:var(--muted);font-size:11.5px}
.slot-body{border-left:3px solid var(--c, var(--line-strong));background:var(--surface);border-radius:0 10px 10px 0;
  padding:8px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.slot.past .slot-body{opacity:.55}
.slot.now .slot-body{box-shadow:0 0 0 2px color-mix(in srgb,var(--c, var(--accent)) 35%,transparent)}
.slot-name{font-weight:600}
.slot-meta{font-size:13px;color:var(--text-2)}
.progress{height:4px;background:var(--surface-2);border-radius:3px;margin-top:7px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--c, var(--accent))}
.slot.free .slot-body{border-left-style:dashed;border-left-color:var(--line-strong);background:var(--bg)}
.opts{display:grid;gap:7px;margin-top:9px}
.opt{text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 11px;
  display:grid;gap:3px}
.opt:hover{border-color:var(--accent)}
.opt-title{font-weight:500;line-height:1.35}
.opt-why{font-size:12.5px;color:var(--text-2)}
.opt.chosen{border:2px solid var(--accent);padding:8px 10px;cursor:default}
.opt.done{border-color:var(--tick)}
.opt-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.holiday{font-size:15px;padding:18px 4px;color:var(--text-2)}

/* ---------- to-dos ---------- */
.quickadd{display:flex;gap:8px}
.qa-preview{display:flex;gap:6px;flex-wrap:wrap;min-height:26px;margin:8px 0 4px}
.tasks{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);padding:0;margin-top:1px;
  display:grid;place-items:center;color:transparent;font-size:13px}
.task.p-high .check{border-color:var(--pen)}
.task.is-done .check{background:var(--tick);border-color:var(--tick);color:#fff}
.task.is-done .task-title{text-decoration:line-through;color:var(--muted)}
.task-main{border:0;background:none;padding:0;text-align:left;display:grid;gap:1px;min-width:0}
.task-title{overflow-wrap:anywhere}
.task-meta{font-size:12.5px;color:var(--text-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.late{color:var(--pen);font-weight:500}
.prio-high{color:var(--pen);font-weight:600}
.prio-low{color:var(--muted)}
.tests-strip{display:grid;gap:8px}
.test-row{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--surface)}
.days-left{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.days-left.close{color:var(--pen);font-weight:500}

/* ---------- work: upload, read, review ---------- */
.pickers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:430px){.pickers{grid-template-columns:repeat(2,1fr)}}
/* the week strip: pick a day to plan or look back at */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}
.daychip{flex:none;display:grid;justify-items:center;gap:0;min-width:56px;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:6px 8px}
.daychip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.daychip.off{opacity:.5}
.daychip.wkend{border-style:dashed}
.slot.own .slot-body{border-left-style:solid;border-left-color:var(--accent);background:var(--surface)}
.dc-wd{font-size:11.5px}
.dc-d{font-family:var(--mono);font-size:18px;font-weight:500;line-height:1.3}
.dc-n{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.daychip.on .dc-n{color:var(--accent)}
.logrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.logrow:first-child{border-top:0}
.logrow .when{font-family:var(--mono);font-size:12px;color:var(--text-2);line-height:1.3}
.logrow .res{font-size:12.5px;text-align:right;white-space:nowrap}
.kind.k-custom{background:var(--surface-2);color:var(--text)}
.drive-list{border:1px solid var(--line);border-radius:10px;max-height:52vh;overflow:auto;background:var(--surface)}
.drive-list button{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 11px;font-size:14px}
.drive-list button:first-child{border-top:0}
.drive-list small{color:var(--muted);font-family:var(--mono);font-size:11px}
.crumbs{font-family:var(--mono);font-size:12.5px;color:var(--text-2);margin:0 0 8px;overflow-wrap:anywhere}
.picker{border:1px dashed var(--line-strong);background:var(--surface);border-radius:12px;padding:16px 8px;display:grid;justify-items:center;gap:6px;
  font-weight:500;font-size:14px;text-align:center}
.picker svg{width:26px;height:26px;color:var(--accent)}
.picker small{font-weight:400;color:var(--muted);font-size:12px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.thumb{position:relative;flex:none;width:92px}
.thumb img,.thumb .pdf{width:92px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.thumb button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);padding:0;font-size:14px;line-height:1}
.thumb.addpage{width:92px;height:120px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--surface);
  display:grid;place-items:center;align-content:center;gap:2px;font-size:12.5px;color:var(--text-2);padding:0;align-self:flex-start}
.thumb.addpage span{font-size:26px;line-height:1;color:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mode{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 11px;text-align:left;display:grid;gap:1px}
.mode b{font-weight:600;font-size:14px;color:var(--text)}
.mode small{font-size:12px;color:var(--muted);line-height:1.3}
.mode[aria-pressed="true"]{border:2px solid var(--accent);padding:8px 10px;background:var(--accent-soft)}
.segwrap{max-width:100%;overflow-x:auto;scrollbar-width:none}
.segwrap .seg button{white-space:nowrap}
.segwrap .seg b{font-family:var(--mono);font-weight:500;font-size:.92em;margin-left:3px}
@media (max-width:559px){
  .segwrap{width:100%}
  .segwrap .seg{display:flex;width:100%}
  .segwrap .seg button{flex:1 1 auto;padding:7px 6px;font-size:13px}
}
.meta{font-size:13px;color:var(--text-2);line-height:1.5}
.meta .dot{margin-right:5px;vertical-align:1px}
.thumb figcaption{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.reading{display:grid;justify-items:center;gap:10px;padding:26px 10px;text-align:center}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pen);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner,.status[data-kind="busy"] i{animation:none}}

/* The teacher's mark: the score in red pen, ringed. */
.stamp{font-family:var(--hand);color:var(--pen);font-size:40px;line-height:1;display:inline-grid;place-items:center;
  padding:10px 18px 6px;border:2.5px solid var(--pen);border-radius:52% 48% 50% 46% / 55% 45% 52% 48%;transform:rotate(-5deg);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.stamp small{font-size:.5em}
.stamp.sm{font-size:24px;padding:5px 10px 2px;border-width:2px}

/* Marked questions sit on an exercise-book page: a red margin line, faint rules. */
.page{border:1px solid var(--line);border-radius:10px;background:var(--surface);
  background-image:linear-gradient(to right, transparent 46px, color-mix(in srgb,var(--pen) 45%,transparent) 46px, color-mix(in srgb,var(--pen) 45%,transparent) 47px, transparent 47px);
  overflow:hidden}
.q{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:11px 12px 11px 6px;border-top:1px solid var(--rule)}
.q:first-child{border-top:0}
.q-label{font-family:var(--mono);font-weight:500;text-align:right;padding-top:2px}
.q-mark{font-family:var(--hand);font-size:22px;line-height:1}
.q-mark.ok{color:var(--tick)}
.q-mark.no{color:var(--pen)}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-edit{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.q-edit input{width:58px;padding:5px 7px;text-align:center}
.q-edit select{width:auto;padding:5px 7px;font-size:13px}
.q-text{font-size:14px;color:var(--text-2);margin-top:5px}
.q-text b{color:var(--text);font-weight:600}
.working{font-family:var(--mono);font-size:13px;white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:6px;overflow-x:auto}
.resolved{color:var(--tick);font-size:13px;font-weight:500}
.toggle{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:13px}
.toggle.ok{color:var(--tick);border-color:var(--tick)}
.toggle.no{color:var(--pen);border-color:var(--pen)}
.folder{font-family:var(--mono);font-size:12.5px;color:var(--text-2);overflow-wrap:anywhere}
.suggest{border:1px solid var(--line);border-radius:10px;margin-top:6px;max-height:220px;overflow:auto;background:var(--surface)}
.suggest button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 10px;font-size:14px}
.suggest button:first-child{border-top:0}
.suggest small{color:var(--muted);font-family:var(--mono);font-size:11px}

/* ---------- history ---------- */
.mistake-group h3{font-size:14px;display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.mistake{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;
  border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.attempt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;
  border:0;border-top:1px solid var(--line);background:none;padding:11px 0}
.attempt:first-child{border-top:0}
.attempt .t{font-weight:500}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
.open-n{font-family:var(--mono);font-size:11.5px;color:var(--pen)}

/* ---------- skills ---------- */
.subj-level{display:grid;gap:8px}
.level-num{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;position:relative}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:5px}
.lv-low{background:var(--pen)} .lv-mid{background:var(--warn)} .lv-high{background:var(--tick)}
.topic-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.topic-row .mono{text-align:right;font-size:13px}
.ev{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.advice{font-size:13.5px;color:var(--text-2);border-left:3px solid var(--warn);padding-left:10px}
.skills-grid{display:grid;gap:16px}
@media (min-width:820px){.skills-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- sheet (bottom on phones, centred on iPad) ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:16px 16px 0 0;

.sheet-h h2{font-size:17px;flex:1}

.rate button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom, 0px));z-index:60;
  background:var(--text);color:var(--bg);border-radius:10px;padding:9px 14px;font-size:14px;max-width:min(92vw,520px)}

<script>
/* ======================================================================
   A Level Companion

   Your phone's side of the A Level dashboard. It keeps nothing of its own:
   the dashboard holds the data, and this page reads a daily projection of it
   and sends back small named changes.

   Two ways to reach the dashboard, chosen at load:
     - inside Claude, through the "A Level Dashboard" connector (the page has
       no network of its own there, but it can call your connectors)
     - opened from the dashboard's own server at /companion, over plain fetch

   Inside Claude it can also use your Google Drive connector (to file your
   work in folders) and Claude itself (to read and mark it), billed to your
   Claude plan rather than an API key.
   ====================================================================== */
// The connector's name as you typed it in claude.ai; any capitalisation is found at load.
let DASH = 'A Level Dashboard';
const DRIVE = 'Google Drive';
const DRIVE_ROOT = 'A Levels';          // default top folder; found by name, created only if missing
const FOLDER_MIME = 'application/vnd.google-apps.folder';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('alc:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('alc:' + k, JSON.stringify(v)); } catch { /* storage full or blocked */ } },
};
const pad = (n) => String(n).padStart(2, '0');
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const nowISO = () => isoOf(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parseD = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const addDays = (iso, n) => { const d = parseD(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const toMins = (t) => { const [h, m] = String(t || '0:0').split(':').map(Number); return h * 60 + m; };
const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtDay = (iso) => parseD(iso).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
function relDay(iso) {
  const d = daysBetween(nowISO(), iso);
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  if (d === -1) return 'yesterday';
  if (d < 0) return `${-d} days late`;
  if (d < 7) return parseD(iso).toLocaleDateString('en-GB', { weekday: 'long' });
  return fmtDay(iso);
}

const APP = {
  data: LS.get('data', null),
  syncedAt: LS.get('syncedAt', null),
  outbox: LS.get('outbox', []),
  tab: LS.get('tab', 'today'),
  transport: null, mode: 'connecting', status: { kind: 'busy', text: 'Connecting…' },
  mcp: null, sample: null, limits: null, fileArgs: false,
  work: { stage: 'idle', pages: [], hint: { subjectId: '', homeworkId: '' }, tier: LS.get('tier', 'quick'),
    mode: LS.get('workMode', 'worksheet'), worksheetId: '' },
  history: { view: 'mistakes', subject: '' },
  details: {},            // attempt id -> full marking, fetched on demand
  sheets: {},             // worksheet id -> its questions, fetched on demand
  skillsOpen: null,
  week: LS.get('week', null),  // study periods ahead, and the study log
  selDay: null,                // the day shown in Today; null = today
};

/* ================================================================ lookups */
const subjects = () => APP.data?.subjects || [];
const subjectOf = (id) => subjects().find((s) => s.id === id);
const subjectName = (id) => subjectOf(id)?.name || 'General';
const colourOf = (id) => subjectOf(id)?.colour || 'var(--muted)';
const topicOf = (id) => (APP.data?.topics || []).find((t) => t.id === id);
const unitShort = (unit) => {
  let u = String(unit || '').replace(/\s*\(.*\)\s*$/, '');
  if (u.includes(' — ')) u = u.split(' — ')[0];
  if (/^\d+\s/.test(u)) u = u.split(' ')[0];
  return u;
};
const levelOf = (tid) => APP.data?.mastery?.topics?.[tid] || null;
const lvClass = (s) => (s == null ? '' : s < 40 ? 'lv-low' : s < 65 ? 'lv-mid' : 'lv-high');

/* ============================================================== transport */
async function rest(path, init = {}) {
  const r = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...init });
  if (r.status === 401) throw { code: 'signin', message: 'Sign in to the dashboard, then come back.' };
  if (!r.ok) throw { code: 'http', message: `The dashboard answered ${r.status}.` };
  return r.json();
}
async function dash(tool, input) {
  const r = await APP.mcp.callTool(DASH, tool, input, { cache: false });
  const p = r?.payload;
  return p && typeof p === 'object' ? p : r?.structuredContent;
}
// Plans cover this week from Monday, and next week.
const weekFrom = () => { const d = parseD(nowISO()); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoOf(d); };
const TRANSPORT = {
  rest: {
    today: () => rest(`/api/app/today?date=${nowISO()}&time=${nowHM()}`),
    week: () => rest(`/api/app/week?from=${weekFrom()}&days=14&date=${nowISO()}&time=${nowHM()}`),
    apply: (ops) => rest('/api/app/ops', { method: 'POST', body: JSON.stringify({ ops, date: nowISO(), time: nowHM() }) }),
    attempt: (q) => rest('/api/app/attempt?' + new URLSearchParams(typeof q === 'string' ? { id: q } : q)),
  },
  mcp: {
    today: () => dash('get_today', { date: nowISO(), time: nowHM(), detail: 'full' }),
    week: () => dash('get_week', { from: weekFrom(), days: 14, date: nowISO(), time: nowHM() }),
    apply: (ops) => dash('apply_changes', { ops, date: nowISO(), time: nowHM() }),
    attempt: (q) => dash('get_attempt', typeof q === 'string' ? { id: q } : q),
  },
};

/* Connector failures each have their own fix, so each gets its own words. */
function connError(e, server = DASH) {
  const s = server === DASH ? 'the A Level Dashboard connector' : 'your Google Drive connector';
  switch (e?.code) {
    case 'signin': return e.message;
    case 'needs_reauth': return `Reconnect ${s} in claude.ai → Settings → Connectors.`;
    case 'server_not_connected': case 'server_not_found':
      return server === DASH ? 'Add the dashboard as a connector first — tap here for how.' : 'Add Google Drive in claude.ai → Settings → Connectors.';
    case 'selection_required': return `You have two connectors called “${server}”. Pick one when Claude asks.`;
    case 'not_in_manifest': return `${server} is switched off for this page. Allow it in the page's connector settings.`;
    case 'blocked_by_policy': case 'approval_required': return `Your organisation blocks ${server} here.`;
    case 'server_unavailable': case 'upstream_error': case 'rate_limited':
      return server === DASH ? 'The dashboard did not answer — it may be waking up. Try again in a minute.' : 'Google Drive did not answer. Try again in a minute.';
    case 'not_granted': case 'capability_disabled': case 'capability_removed':
      return 'Connectors are not available in this view. Open the page in the Claude app or claude.ai.';
    case 'tool_error': return (e.message || 'The tool reported an error.').replace(/^Error:\s*/, '');
    default: return e?.message || 'Could not reach the dashboard.';
  }
}
const SAMPLE_CODES = new Set(['not_granted', 'sampling_disabled', 'rate_limited', 'images_unavailable', 'image_rejected',
  'refused', 'invalid_json', 'empty_completion', 'session_expired', 'prompt_too_large', 'cancelled']);
function sampleError(e) {
  return ({
    not_granted: 'You declined Claude for this page. Reload to be asked again.',
    sampling_disabled: 'Claude is not available on this account.',
    rate_limited: 'Claude is busy or you have hit your usage limit. Try again later.',
    images_unavailable: 'This Claude view cannot send photos. Open the page on claude.ai in a browser.',
    image_rejected: 'That file could not be read as a photo. Try another one.',
    refused: 'Claude would not mark that. Try a clearer photo.',
    invalid_json: 'Claude\'s answer came back garbled. Try again — Careful mode helps.',
    empty_completion: 'Claude returned nothing. Try again with fewer pages.',
    session_expired: 'Sign in to Claude again, then retry.',
    prompt_too_large: 'Too much at once. Try fewer pages.',
    cancelled: 'Stopped.',
  })[e?.code] || 'Claude did not finish. Try again.';
}

function setStatus(kind, text) {
  APP.status = { kind, text };
  const b = $('#statusBtn');
  if (!b) return;
  if (kind === 'ok' && APP.outbox.length) { kind = 'waiting'; text = `${APP.outbox.length} change${APP.outbox.length === 1 ? '' : 's'} waiting`; }
  if (kind === 'ok') text = 'Synced ' + (APP.syncedAt ? new Date(APP.syncedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '');
  b.dataset.kind = kind;
  $('#statusText').textContent = text;
}

/* Calling a connector you have not added yet fails like a network blip, which
   read as "the dashboard may be waking up" when the real answer is "connect
   it". Ask the connector list which one it is. */
async function dashboardMissing(e) {
  if (APP.mode !== 'claude' || !APP.mcp) return null;
  if (!['upstream_error', 'server_not_connected', 'server_not_found', 'not_in_manifest', 'selection_required'].includes(e?.code)) return null;
  try {
    const { servers = [] } = await APP.mcp.listTools(DASH);
    const me = servers.find((s) => s.server === DASH);
    if (!me || !me.tools?.length) return 'Connect your dashboard first — tap here for how';
    if (me.authStatus !== 'connected') return 'Could not reach the dashboard. Not connected yet? Tap here for how';
  } catch { return 'Connect your dashboard first — tap here for how'; }
  return null;
}

let refreshing = null;
function refresh() {
  if (!APP.transport) return Promise.resolve();
  if (refreshing) return refreshing;
  setStatus('busy', APP.data ? 'Updating…' : 'Connecting to your dashboard…');
  const slow = setTimeout(() => setStatus('busy', 'Waking the dashboard — up to a minute'), 6000);
  refreshing = (async () => {
    try {
      const d = await APP.transport.today();
      if (!d || !Array.isArray(d.lessons)) throw { code: 'bad', message: 'The dashboard sent something unexpected. Is it up to date?' };
      APP.data = d;
      // the week view is a bonus: a dashboard too old to have it still works
      try {
        const wk = await APP.transport.week();
        if (wk && Array.isArray(wk.days)) { APP.week = wk; LS.set('week', wk); }
      } catch { /* keep the last copy */ }
      APP.syncedAt = new Date().toISOString();
      LS.set('data', d); LS.set('syncedAt', APP.syncedAt);
      for (const op of APP.outbox) applyLocal(op);        // pending changes stay visible
      setStatus('ok');
    } catch (e) {
      const setup = await dashboardMissing(e);
      if (setup) setStatus('setup', setup);
      else setStatus(e?.code === 'server_not_connected' ? 'setup' : 'error', connError(e));
    } finally {
      clearTimeout(slow);
      refreshing = null;
      render();
    }
  })();
  return refreshing;
}

/* ================================================================ changes
   Every change is an op with its own id. It is shown at once, queued here
   (and in storage, so closing the app loses nothing), and sent when the
   dashboard is reachable. Sending the same op twice is harmless: the
   dashboard applies each id once. */
function send(op) {
  op.id ||= newId('op');
  APP.outbox.push(op);
  LS.set('outbox', APP.outbox);
  applyLocal(op);
  render();
  scheduleFlush();
}
let flushTimer = null, flushing = false;
function scheduleFlush(ms = 400) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
async function flush() {
  if (flushing || !APP.outbox.length || !APP.transport) return;
  flushing = true;
  let ok = false;
  try {
    const batch = APP.outbox.slice(0, 20);
    setStatus('busy', 'Saving…');
    const res = await APP.transport.apply(batch);
    const seen = new Set((res?.results || []).map((r) => r.id));
    APP.outbox = APP.outbox.filter((o) => !seen.has(o.id));
    LS.set('outbox', APP.outbox);
    const bad = (res?.results || []).filter((r) => !r.ok);
    if (bad.length) toast('Not saved: ' + bad[0].error);
    ok = true;
  } catch (e) {
    setStatus('error', connError(e));
  } finally {
    flushing = false;
  }
  if (!ok) return;
  if (APP.outbox.length) return flush();
  await refresh();
}

// The same change, applied to the copy on screen until the dashboard confirms it.
const LOCAL = {
  'task.add': (d, op) => { if (!d.tasks.some((t) => t.id === op.task.id)) d.tasks.unshift({ priority: 'normal', ...op.task, done: false }); },
  'task.update': (d, op) => { const t = [...d.tasks, ...d.done].find((x) => x.id === op.taskId); if (t) Object.assign(t, op.patch); },
  'task.done': (d, op) => {
    const from = op.done === false ? d.done : d.tasks, to = op.done === false ? d.tasks : d.done;
    const i = from.findIndex((x) => x.id === op.taskId);
    if (i >= 0) { const [t] = from.splice(i, 1); t.done = op.done !== false; to.unshift(t); }
  },
  'task.delete': (d, op) => { d.tasks = d.tasks.filter((x) => x.id !== op.taskId); d.done = d.done.filter((x) => x.id !== op.taskId); },
  'study.choose': (d, op) => {
    for (const s of studySlots(op.date)) if (s.key === op.key) { s.chosen = op.option; s.done = false; }
    for (const w of (d.worksheets || [])) w.planned = (w.planned || []).filter((p) => !(p.date === op.date && p.key === op.key));
    const w = op.option?.worksheetId && (d.worksheets || []).find((x) => x.id === op.option.worksheetId);
    if (w) w.planned.push({ date: op.date, key: op.key, done: false });
  },
  'worksheet.add': (d, op) => {
    const w = op.worksheet;
    if ((d.worksheets ||= []).some((x) => x.id === w.id)) return;
    d.worksheets.unshift({ ...w, date: nowISO(), created: new Date().toISOString(), questionCount: op.questions.length,
      maxMarks: op.questions.reduce((a, q) => a + (Number(q.maxMarks) || 0), 0), attempts: [], planned: [] });
    if (w.hash) (d.worksheetHashes ||= {})[w.hash] = w.id;
    APP.sheets[w.id] ||= { found: true, questions: op.questions, summary: op.summary || '', attempts: [] };
  },
  'worksheet.update': (d, op) => { const w = (d.worksheets || []).find((x) => x.id === op.worksheetId); if (w) Object.assign(w, op.patch); },
  'worksheet.delete': (d, op) => {
    d.worksheets = (d.worksheets || []).filter((x) => x.id !== op.worksheetId);
    for (const a of d.attempts) if (a.worksheetId === op.worksheetId) delete a.worksheetId;
  },
  'work.save': (d, op) => {
    const a = op.attachment;
    if (a.kind !== 'notes' || (d.notes ||= []).some((x) => x.id === a.id)) return;
    d.notes.unshift({ id: a.id, title: a.title, date: nowISO(), subjectId: a.subjectId, topicIds: a.topicIds || [], driveUrl: a.driveUrl,
      folder: a.folder, summary: op.notes?.summary || '', keyPoints: op.notes?.keyPoints || [] });
  },
  'attachment.delete': (d, op) => { d.notes = (d.notes || []).filter((x) => x.id !== op.attachmentId); },
  'study.done': (d, op) => {
    for (const s of studySlots(op.date)) if (s.key === op.key) {
      s.done = true;
      const log = APP.week?.log;
      if (log && s.chosen && !log.some((e) => e.date === op.date && e.key === op.key)) {
        log.unshift({ date: op.date, key: op.key, start: s.start, end: s.end, option: s.chosen, done: true,
          minutes: op.minutes ?? s.mins, confidence: op.confidence ?? null, note: op.note || '' });
      }
    }
  },
  'study.undo': (d, op) => {
    for (const s of studySlots(op.date)) if (s.key === op.key) s.done = false;
    if (APP.week?.log) APP.week.log = APP.week.log.filter((e) => !(e.date === op.date && e.key === op.key));
  },
  'study.slot.add': (d, op) => {
    const key = 'x' + op.start;
    const end = (() => { const m = Math.min(1439, toMins(op.start) + (op.minutes || 60)); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); })();
    const sp = { key, start: op.start, end, mins: op.minutes || 60, extra: true, title: op.title || 'Study session', options: [], chosen: null, done: false };
    for (const list of studyLists(op.date)) if (!list.some((x) => x.key === key)) { list.push({ ...sp }); list.sort((a, b) => toMins(a.start) - toMins(b.start)); }
  },
  'study.slot.remove': (d, op) => {
    for (const list of studyLists(op.date)) { const i = list.findIndex((x) => x.key === op.key); if (i >= 0) list.splice(i, 1); }
    if (APP.week?.log) APP.week.log = APP.week.log.filter((e) => !(e.date === op.date && e.key === op.key));
  },
  'test.add': (d, op) => { if (!d.tests.some((t) => t.id === op.test.id)) d.tests.push({ ...op.test, result: null }); },
  'test.update': (d, op) => { const t = d.tests.find((x) => x.id === op.testId); if (t) Object.assign(t, op.patch); },
  'test.delete': (d, op) => { d.tests = d.tests.filter((x) => x.id !== op.testId); },
  'test.result': (d, op) => { const t = d.tests.find((x) => x.id === op.testId); if (t) t.result = Math.round(op.mark / op.total * 100); },
  'mistake.resolve': (d, op) => {
    d.mistakes = d.mistakes.filter((m) => !(m.attemptId === op.attemptId && String(m.q) === String(op.q)));
    const q = d.attempts.find((x) => x.id === op.attemptId)?.questions.find((x) => String(x.q) === String(op.q));
    if (q) q.resolved = op.how;
  },
};
// A study period can appear twice on screen — in today's copy and in the week's.
function studyLists(date) {
  const out = [];
  if (APP.data?.date === date) out.push(APP.data.studyPeriods ||= []);
  const day = APP.week?.days?.find((x) => x.date === date);
  if (day) out.push(day.studyPeriods ||= []);
  return out;
}
const studySlots = (date) => studyLists(date).flat();
function applyLocal(op) { try { if (APP.data) LOCAL[op.type]?.(APP.data, op); } catch { /* the refresh will correct it */ } }

// Replacing a section can blur a focused field, whose change handler renders
// again mid-replace; that nested render waits and runs once this one is done.
let rendering = false, renderAgain = false;
function render() {
  if (rendering) { renderAgain = true; return; }
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
  if (renderAgain) { renderAgain = false; render(); }
}
function renderNow() {
  // keep what you are typing: remember focus and values of marked inputs
  const active = document.activeElement?.id;
  const keep = {};
  document.querySelectorAll('[data-keep]').forEach((el) => { keep[el.id] = [el.value, el.selectionStart]; });

  renderHeader();
  document.querySelectorAll('nav.tabbar button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === APP.tab)));
  document.querySelectorAll('section.tab').forEach((s) => s.classList.toggle('on', s.id === 'tab-' + APP.tab));
  const host = $('#tab-' + APP.tab);
  host.innerHTML = ({ today: viewToday, work: viewWork, history: viewHistory, skills: viewSkills })[APP.tab]();

  for (const [id, [v, pos]] of Object.entries(keep)) {
    const el = document.getElementById(id);
    if (el && el.value !== v) el.value = v;
    if (el && id === active) { el.focus(); try { el.setSelectionRange(pos, pos); } catch { /* not a text field */ } }
  }
  if (APP.tab === 'today') updateQuickPreview();
  const n = APP.data?.mistakes?.length || 0;
  const badge = $('#mistakeBadge');
  badge.hidden = !n; badge.textContent = n;
}

// One day's timetable with its study periods. Today's copy knows what is on
// now; another day's is all past or all ahead.
function timetable(date, week, lessons, studyPeriods, title, note = '') {
  const today = nowISO(), now = toMins(nowHM());
  // your own study sessions are rows of their own, slotted in by time
  const own = studyPeriods.filter((s) => s.extra).map((s) => ({ key: s.key, start: s.start, end: s.end,
    name: s.title || 'Study session', free: true, own: true }));
  const all = [...lessons, ...own].sort((a, b) => toMins(a.start) - toMins(b.start));
  const rows = all.map((l) => {
    const state = date < today ? 'past' : date > today ? 'later'
      : now >= toMins(l.end) ? 'past' : now >= toMins(l.start) ? 'now' : 'later';
    const pct = state === 'now' ? Math.round((now - toMins(l.start)) / Math.max(1, toMins(l.end) - toMins(l.start)) * 100) : 0;
    const sp = studyPeriods.find((s) => s.key === l.key);
    const study = Boolean(sp) || l.study;
    return `<li class="slot ${state}${study || l.free ? ' free' : ''}${l.own ? ' own' : ''}" style="--c:${l.colour || 'var(--line-strong)'}">
      <div class="slot-time">${esc(l.start)}<span>${esc(l.end)}</span></div>
      <div class="slot-body">
        <div class="row"><span class="slot-name">${esc(l.name)}</span>
          <span class="slot-meta">${[l.room, l.double ? 'double' : '', state === 'now' ? 'now' : ''].filter(Boolean).map(esc).join(' · ')}</span>
          ${l.own && !sp?.done ? `<span class="spacer"></span><button class="btn ghost sm" data-act="slot-remove" data-date="${esc(date)}" data-key="${esc(l.key)}" data-armed="0">Remove</button>` : ''}</div>
        ${state === 'now' ? `<div class="progress"><span style="width:${pct}%"></span></div>` : ''}
        ${sp ? studyBlock(sp, state, date) : ''}
      </div>
    </li>`;
  }).join('');
  return `<div class="card"><div class="card-h"><h2>${esc(title)}</h2>${week ? `<span class="count">week ${esc(week)}</span>` : ''}</div>
    ${note ? `<div class="holiday" style="padding:4px 2px 12px">${note}</div>` : ''}

}

/* ----------------------------------------------------- quick add, typo-proof
   "phys wksht 3 fri high" -> Physics, due Friday, high priority, title
   "wksht 3". Subject words are matched loosely, so "pyhsics" and "furhter"
   still land; short ones ("de", "fm") only count as the first word. */
const SUBJECT_WORDS = {
  maths: ['maths', 'math', 'mathematics', 'pure', 'stats', 'statistics', 'mechanics', 'p1', 'p2', 'p3', 'p4', 's1', 'm1', 'ma'],
  fmaths: ['further', 'fmaths', 'furthermaths', 'fp1', 'd1', 'decision', 'm2', 'fm'],
  physics: ['physics', 'phys', 'phy', 'physic', 'ph'],
  cs: ['cs', 'compsci', 'computing', 'computer', 'comp', 'programming', 'coding', '9618'],
  german: ['german', 'deutsch', 'ger', 'de'],
};
const WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
function osa(a, b) {                       // edit distance with swapped letters counting once
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    const c = a[i - 1] === b[j - 1] ? 0 : 1;
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
// Short words must match exactly ("come" is not "comp"); long ones forgive a
// typo or two, which is where typos actually happen ("pyhsics", "furhter").
const near = (w, target) => w === target || (target.length >= 6 && w.length >= 5 && osa(w, target) <= (target.length >= 7 ? 2 : 1));

function subjectFromWord(w, first) {
  for (const [sid, words] of Object.entries(SUBJECT_WORDS)) {
    if (!subjectOf(sid)) continue;
    for (const t of words) {
      if (t.length <= 2 ? (first && w === t) : near(w, t)) return sid;
    }
  }
  for (const s of subjects()) if (near(w, s.name.toLowerCase())) return s.id;
  return null;
}
function dayFromWord(w) {
  const today = nowISO();
  if (['today', 'tday', 'tod', 'tonight', 'tonite'].includes(w)) return today;
  if (['tmr', 'tmrw', 'tmw', 'tom', 'tomo', 'tomoz', 'tomorrow'].includes(w) || near(w, 'tomorrow')) return addDays(today, 1);
  const i = WEEKDAYS.findIndex((d) => w.length >= 3 && (d.startsWith(w) || near(w, d) || (w.length === 3 && d.slice(0, 3) === w)));
  if (i >= 0) {                          // the next one after today
    const cur = parseD(today).getDay();
    return addDays(today, ((i - cur + 7) % 7) || 7);
  }
  let m = w.match(/^(\d{1,2})[/.](\d{1,2})$/);
  if (m) {
    const y = parseD(today).getFullYear();
    let iso = `${y}-${pad(m[2])}-${pad(m[1])}`;
    if (iso < today) iso = `${y + 1}-${pad(m[2])}-${pad(m[1])}`;
    return iso;
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(w)) return w;
  m = w.match(/^(\d{1,2})d$/);
  if (m) return addDays(today, Number(m[1]));
  return null;
}
function parseQuick(text) {
  const words = String(text).trim().split(/\s+/).filter(Boolean);
  const out = { subjectId: '', due: null, priority: 'normal', rest: [] };
  words.forEach((raw, i) => {
    const w = raw.toLowerCase().replace(/[,;]+$/, '');
    if (/^!{1,3}$/.test(w) || ['high', 'hi', 'urgent', 'important', 'asap', 'hgih', 'hihg'].includes(w)) { out.priority = 'high'; return; }
    if (['low', 'lo', 'whenever', 'someday'].includes(w)) { out.priority = 'low'; return; }
    if (w === 'next' && ['week', 'wk'].includes((words[i + 1] || '').toLowerCase())) { out.due ||= addDays(nowISO(), 7); out.skip = i + 1; return; }
    if (out.skip === i) return;
    if (['due', 'by', 'for', 'on'].includes(w) && dayFromWord((words[i + 1] || '').toLowerCase())) return;
    const day = !out.due && dayFromWord(w);
    if (day) { out.due = day; return; }
    if (!out.subjectId) {
      const sid = subjectFromWord(w, i === 0);
      if (sid) {
        out.subjectId = sid;
        // "further maths": the second word belongs to the subject too
        if (sid === 'fmaths' && /^math/.test((words[i + 1] || '').toLowerCase())) out.skip = i + 1;
        return;
      }
    }
    out.rest.push(raw);
  });
  out.title = out.rest.join(' ') || String(text).trim();
  return out;
}
function updateQuickPreview() {
  const host = $('#qaPreview'), input = $('#qaText');
  if (!host || !input) return;
  const v = input.value.trim();
  if (!v) { host.innerHTML = '<span class="muted" style="font-size:12.5px">Type fast — subject, day and “high” are picked out for you.</span>'; return; }
  const p = parseQuick(v);
  host.innerHTML = [
    `<span class="chip">“${esc(p.title)}”</span>`,
    p.subjectId ? `<span class="chip"><span class="dot" style="--c:${colourOf(p.subjectId)}"></span>${esc(subjectName(p.subjectId))}</span>` : '<span class="chip muted">no subject</span>',
    p.due ? `<span class="chip">due ${esc(relDay(p.due))}</span>` : '',
    p.priority !== 'normal' ? `<span class="chip">${p.priority === 'high' ? '<span class="prio-high">High</span>' : 'Low'}</span>` : '',
  ].join('');
}
function quickAdd() {
  const input = $('#qaText');
  const v = input?.value.trim();
  if (!v) return input?.focus();
  const p = parseQuick(v);
  input.value = '';                     // before send(): its re-render keeps whatever the box holds
  send({ type: 'task.add', task: { id: newId('h'), title: p.title, subjectId: p.subjectId, due: p.due, priority: p.priority } });
  $('#qaText')?.focus();
}

     - a worksheet: questions to do later. Claude reads the questions and the
       topic; it gets its own Drive folder inside the topic's folder, and can
       be planned into study periods.
     - your answers to a saved worksheet: marked against its questions, and
       filed in the worksheet's folder with Claude's corrections beside them.
     - notes: read for their topic and key points, filed, and logged as notes.
     - anything else: marked straight away, or just filed.                 */
const KINDS = { answers: 'Worked answers', notes: 'Notes', worksheet: 'Worksheet', test: 'Test paper' };
const MODES = [
  ['worksheet', 'Worksheet', 'questions to do later'],
  ['answers', 'My answers', 'to a saved worksheet'],

const worksheetOf = (id) => worksheetList().find((w) => w.id === id) || null;
// Worksheets to answer: unanswered ones first, the ones planned soonest before the rest.

  const next = (w) => (w.planned || []).find((p) => !p.done)?.date || '9999';
  return worksheetList().slice().sort((a, b) => (a.attempts?.length ? 1 : 0) - (b.attempts?.length ? 1 : 0)
    || next(a).localeCompare(next(b)) || String(b.created || b.date).localeCompare(String(a.created || a.date)));
}

/* ------------------------------------------------------------ pages in */
async function downscale(file, maxPx = 1.6e6) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const k = Math.min(1, Math.sqrt(maxPx / (img.naturalWidth * img.naturalHeight)));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.8));
    return { blob, w, h, url: URL.createObjectURL(blob) };
  } finally { URL.revokeObjectURL(url); }
}

let pdfjsReady = null;
function loadPdfJs() {
  // The worker is loaded as a plain script too: a page here cannot start a
  // worker from another host, and pdf.js then runs it on the main thread.
  const add = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
  pdfjsReady ||= add(PDFJS + 'pdf.min.js').then(() => add(PDFJS + 'pdf.worker.min.js')).then(() => {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
    return window.pdfjsLib;
  });
  return pdfjsReady;
}
async function pdfToImages(file, maxPages) {
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const out = [];
  for (let n = 1; n <= Math.min(doc.numPages, maxPages); n++) {
    const page = await doc.getPage(n);
    const v1 = page.getViewport({ scale: 1 });
    const scale = Math.min(3, Math.sqrt(1.6e6 / (v1.width * v1.height)));
    const vp = page.getViewport({ scale });
    const c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.8));
    out.push({ blob, w: c.width, h: c.height, url: URL.createObjectURL(blob) });
  }
  return out;
}

async function sha256Hex(buf) {
  if (crypto?.subtle) {
    const h = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  let a = 0x811c9dc5, b = 0x01000193;          // no WebCrypto: a weaker hash still dedupes
  const u = new Uint8Array(buf);
  for (let i = 0; i < u.length; i++) { a = Math.imul(a ^ u[i], 16777619) >>> 0; b = Math.imul(b ^ u[i], 2246822519) >>> 0; }
  return (a.toString(16).padStart(8, '0') + b.toString(16).padStart(8, '0')).repeat(2);
}
async function hashPages(pages) {
  const parts = await Promise.all(pages.map(async (p) => p.hash ||= await sha256Hex(await p.file.arrayBuffer())));
  return parts.length === 1 ? parts[0] : sha256Hex(new TextEncoder().encode(parts.join('|')));
}

async function addFiles(list, extra = {}) {
  const w = APP.work;
  w.error = null; w.already = null;
  const maxImages = APP.limits?.images?.maxCount || 8;
  for (const f of list) {
    try {
      if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
        let images = [];
        try { images = await pdfToImages(f, maxImages); }
        catch { toast(`${f.name}: could not read the PDF here, so it can be filed but not marked.`); }
        w.pages.push({ id: newId('p'), kind: 'pdf', file: f, name: f.name, images, thumb: images[0]?.url || null, ...extra });
      } else if (f.type.startsWith('image/') || /\.(jpe?g|png|heic|webp)$/i.test(f.name)) {
        const img = await downscale(f);
        w.pages.push({ id: newId('p'), kind: 'image', file: f, name: f.name || 'photo.jpg', images: [img], thumb: img.url, ...extra });
      } else {
        toast(`${f.name} is not a photo or a PDF.`);
      }
    } catch {
      toast(`Could not open ${f.name}.`);
    }
  }
  render();
}

// The subject you were just in: the lesson on now, else the last one today.
function lessonSubjectNow() {
  const now = toMins(nowHM());
  const ls = (APP.data?.lessons || []).filter((l) => !l.free && subjectOf(l.subjectId));
  const on = ls.find((l) => now >= toMins(l.start) && now < toMins(l.end));
  const past = ls.filter((l) => toMins(l.end) <= now).pop();
  return (on || past)?.subjectId || '';
}

function normalise(a, hint) {
  const d = APP.data;
  const sid = subjectOf(a?.subjectId) ? a.subjectId : hint.subjectId || '';
  const topicIds = (Array.isArray(a?.topicIds) ? a.topicIds : []).filter((id) => topicOf(id)).slice(0, 6);
  const questions = (Array.isArray(a?.questions) ? a.questions : []).slice(0, 60).map((q, i) => {
    const maxMarks = Math.max(0, Number(q.maxMarks ?? q.max) || 1);
    const marks = Math.min(maxMarks, Math.max(0, Number(q.marks) || 0));
    return { q: String(q.q ?? i + 1).slice(0, 12), topicId: topicOf(q.topicId) ? q.topicId : topicIds[0] || '',
      marks, maxMarks, errorType: ['careless', 'method', 'knowledge', 'timing'].includes(q.errorType) ? q.errorType : (marks < maxMarks ? 'method' : null),
      explanation: String(q.explanation || '').slice(0, 1500), correction: String(q.correction || '').slice(0, 2500) };
  });
  for (const q of questions) if (q.topicId && !topicIds.includes(q.topicId)) topicIds.push(q.topicId);
  const hw = d.tasks.some((t) => t.id === a?.homeworkId) ? a.homeworkId : hint.homeworkId || '';
  return {
    mode: 'other', subjectId: sid, topicIds, homeworkId: hw,
    kind: KINDS[a?.kind] ? a.kind : (questions.length ? 'answers' : 'notes'),
    title: String(a?.title || '').slice(0, 120) || defaultTitle(),
    questions, summary: String(a?.summary || '').slice(0, 1500),
    nextSteps: (Array.isArray(a?.nextSteps) ? a.nextSteps : []).slice(0, 5).map((x) => String(x).slice(0, 300)),
    detected: { subjectId: a?.subjectId || '', topicIds },
  };
}
function normaliseSheet(a, hint) {
  const sid = subjectOf(a?.subjectId) ? a.subjectId : hint.subjectId || '';
  const topicIds = (Array.isArray(a?.topicIds) ? a.topicIds : []).filter((id) => topicOf(id)).slice(0, 6);
  const questions = (Array.isArray(a?.questions) ? a.questions : []).slice(0, 80).map((q, i) => ({
    q: String(q?.q ?? i + 1).slice(0, 12), text: String(q?.text || '').slice(0, 400),
    maxMarks: Math.max(0, Number(q?.maxMarks ?? q?.max) || 1),
    topicId: topicOf(q?.topicId) ? q.topicId : topicIds[0] || '' }));
  for (const q of questions) if (q.topicId && !topicIds.includes(q.topicId)) topicIds.push(q.topicId);
  return { mode: 'worksheet', kind: 'worksheet', subjectId: sid, topicIds, homeworkId: '',
    title: String(a?.title || '').slice(0, 120) || defaultTitle(), questions,
    summary: String(a?.summary || '').slice(0, 600), detected: { subjectId: a?.subjectId || '', topicIds } };
}
function normaliseNotes(a, hint) {
  const sid = subjectOf(a?.subjectId) ? a.subjectId : hint.subjectId || '';
  const topicIds = (Array.isArray(a?.topicIds) ? a.topicIds : []).filter((id) => topicOf(id)).slice(0, 6);
  return { mode: 'notes', kind: 'notes', subjectId: sid, topicIds, homeworkId: '', questions: [],
    title: String(a?.title || '').slice(0, 120) || defaultTitle(),
    summary: String(a?.summary || '').slice(0, 800),
    keyPoints: (Array.isArray(a?.keyPoints) ? a.keyPoints : []).slice(0, 8).map((x) => String(x).slice(0, 200)).filter(Boolean),
    detected: { subjectId: a?.subjectId || '', topicIds } };
}
const defaultTitle = () => APP.work.pages[0]?.name?.replace(/\.[a-z0-9]+$/i, '') || 'Work ' + fmtDay(nowISO());

// The worksheet in full — its questions as read when it was saved. Kept for the session.
async function loadWorksheet(id) {
  if (APP.sheets[id]) return APP.sheets[id];
  const full = await APP.transport.attempt({ worksheetId: id });
  if (full?.found) APP.sheets[id] = full;
  return full?.found ? full : { questions: [], attempts: [] };
}
// The sheet's own pages, fetched back from Drive, for when its questions were
// not written down or the marking should see the diagrams.
async function worksheetImages(ws, max) {
  if (!ws?.fileId || !APP.mcp || max <= 0) return [];
  const r = await APP.mcp.callTool(DRIVE, 'download_file_content', { fileId: ws.fileId }, { cache: false });
  const bytes = driveBytes(r);
  if (!bytes?.length) return [];
  const pdf = bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46;     // %PDF
  const file = new File([bytes], pdf ? 'worksheet.pdf' : 'worksheet.jpg', { type: pdf ? 'application/pdf' : 'image/jpeg' });
  const imgs = pdf ? await pdfToImages(file, max) : [await downscale(file)];
  return imgs.slice(0, max).map((i) => { URL.revokeObjectURL(i.url); return i.blob; });
}

async function analyse(force = false) {
  const w = APP.work;
  readWorkForm();
  const hint = w.hint;
  w.error = null;
  const maxImages = APP.limits?.images?.maxCount || 8;
  const images = w.pages.flatMap((p) => p.images.map((i) => i.blob)).slice(0, maxImages);
  if (!images.length) { w.error = 'There is nothing Claude can read — add a photo.'; return render(); }
  const ws = w.mode === 'answers' ? worksheetOf(w.worksheetId) : null;
  if (w.mode === 'answers' && !ws) { w.error = 'Pick the worksheet these answers belong to.'; return render(); }

  w.hash = await hashPages(w.pages);
  // the same pages are never read twice: the dashboard remembers what it saved,
  // and this device remembers what it read but you did not save yet
  if (!force) {
    const seen = w.mode === 'worksheet' ? APP.data.worksheetHashes?.[w.hash]
      : ['other', 'answers'].includes(w.mode) ? APP.data.markedHashes?.[w.hash] : null;
    if (seen) { w.already = seen; return render(); }
  }
  w.already = null;
  const key = [w.hash, w.mode, w.tier, hint.subjectId, ws?.id || ''].join('|');
  const memo = LS.get('analyses', {});
  if (!force && memo[key]) { w.fromCache = true; w.tierUsed = memo[key].tier; return startReview(memo[key].a); }

  w.stage = 'analysing'; w.fromCache = false; w.progress = null;
  w.ctl = new AbortController();
  render();
  try {
    const tier = w.mode === 'notes' ? 'quick' : w.tier === 'careful' ? 'default' : 'quick';
    const opts = { modelTier: tier, signal: w.ctl.signal };
    let a;
    if (w.mode === 'worksheet') a = normaliseSheet(await APP.sample.json(worksheetPrompt(hint), { ...opts, images }), hint);
    else if (w.mode === 'notes') a = normaliseNotes(await APP.sample.json(notesPrompt(hint), { ...opts, images }), hint);
    else if (w.mode === 'answers') {
      w.progress = `Getting “${ws.title}”…`; render();
      const full = await loadWorksheet(ws.id);
      // the sheet itself goes along when its questions were not read, or in Careful mode for the diagrams
      let sheet = [];
      if (!full.questions?.length || w.tier === 'careful') sheet = await worksheetImages(ws, Math.min(4, maxImages - images.length)).catch(() => []);
      w.progress = null; render();
      a = normalise(await APP.sample.json(answersPrompt(ws, full, sheet.length), { ...opts, images: [...sheet, ...images] }), { subjectId: ws.subjectId, homeworkId: '' });
      Object.assign(a, { mode: 'answers', kind: 'answers', worksheetId: ws.id, homeworkId: '', title: `Answers — ${ws.title}` });
      if (!a.subjectId) a.subjectId = ws.subjectId;
      if (!a.topicIds.length) a.topicIds = [...(ws.topicIds || [])];
    } else a = normalise(await APP.sample.json(markPrompt(hint), { ...opts, images }), hint);
    w.tierUsed = tier;
    const keys = Object.keys(memo);
    if (keys.length > 12) delete memo[keys[0]];
    memo[key] = { a, tier, at: Date.now() };
    LS.set('analyses', memo);
    startReview(a);
  } catch (e) {
    w.stage = 'idle';
    // Claude's own errors read one way; the dashboard or Drive failing on the way reads another
    w.error = !e?.code || SAMPLE_CODES.has(e.code) ? sampleError(e) : connError(e);
    render();
  }
}
function startReview(a) {
  APP.work.review = JSON.parse(JSON.stringify(a));
  APP.work.stage = 'review';
  APP.work.dest = null;
  render();
  planDestination();
}
// Save it without Claude reading it: you fill in what it is.
function fileOnly() {

    kind: mode === 'worksheet' ? 'worksheet' : 'notes', title: defaultTitle(), questions: [], summary: '', keyPoints: [], nextSteps: [], detected: null };
  w.stage = 'review';

  render();
  planDestination();
}

/* ---------------------------------------------------------- Google Drive */
async function drive(tool, input) {
  const r = await APP.mcp.callTool(DRIVE, tool, input, { cache: false });
  const p = r?.payload;
  return p && typeof p === 'object' ? p : (r?.structuredContent || {});
}
const qq = (s) => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
/* Your Drive probably already has a shape — a top "A Levels" folder, a folder
   per subject named your way ("FM", "A level Physics"), and inside those topic
   folders and folders like "Class notes" or "Past papers". Work is
   filed into that shape: existing folders are matched by name, and a folder is
   created only when nothing fits. You see the choice before saving. */
const FOLDERS = {};                          // parent id -> its folders, this session
const norm = (s) => String(s).replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
async function listFolders(parent) {
  if (FOLDERS[parent]) return FOLDERS[parent];
  const res = await drive('search_files', { query: `mimeType = '${FOLDER_MIME}' and parentId = '${qq(parent)}'`,
    pageSize: 100, excludeContentSnippets: true });
  return (FOLDERS[parent] = (res.files || []).filter((f) => f.mimeType === FOLDER_MIME)
    .map((f) => ({ id: f.id, title: String(f.title || '').trim() })));
}
async function driveRoot() {
  const name = LS.get('driveRootName', DRIVE_ROOT);
  const saved = LS.get('driveRoot', null);
  if (saved?.id && saved.name === name) return saved;
  const top = await listFolders('root');
  const hit = top.find((f) => norm(f.title) === norm(name))
    || (norm(name) === norm(DRIVE_ROOT) && top.find((f) => /^a ?levels?$/.test(norm(f.title))));
  const root = hit ? { id: hit.id, title: hit.title, name } : { id: null, title: name, name };
  if (hit) LS.set('driveRoot', root);
  return root;
}
const SUBJECT_FOLDER = {
  maths: ['maths', 'math', 'mathematics'],
  fmaths: ['f maths', 'further maths', 'further mathematics', 'f math', 'further math', 'fm'],
  physics: ['physics', 'phys'],
  cs: ['computer science', 'computing', 'compsci', 'comp sci', 'cs'],
  german: ['german', 'deutsch'],
};
function matchSubject(folders, s) {
  const aliases = [...(SUBJECT_FOLDER[s.id] || []), norm(s.name)];
  const bare = (t) => norm(t).replace(/^(as |a )?levels? /, '').replace(/ (year|yr) ?\d+$/, '').trim();
  return folders.find((f) => aliases.includes(bare(f.title)))
    || folders.find((f) => aliases.some((a) => a.length >= 6 && ` ${bare(f.title)} `.includes(` ${a} `)))
    || null;
}
const STOP = new Set(['and', 'the', 'of', 'a', 'an', 'to', 'in', 'on', 'for', 'with', 'unit', 'notes', 'work']);
const words = (s) => norm(s).split(' ').filter((x) => x && !STOP.has(x) && !/^\d+$/.test(x));
const sameWord = (a, b) => a === b || (a.length >= 5 && b.length >= 5 && a.slice(0, 5) === b.slice(0, 5));
function topicScore(folderTitle, t) {
  const f = words(folderTitle), tw = words(t.name);
  if (!tw.length) return 0;
  let s = tw.filter((x) => f.some((y) => sameWord(x, y))).length / tw.length;
  const u = unitShort(t.unit).toLowerCase();                     // "p1", "9", "unit 1"
  const n = (u.match(/\d+/) || [])[0];
  const title = norm(folderTitle);
  if (n && (new RegExp(`\\bunit ${n}\\b`).test(title) || (/^[a-z]+\d+$/.test(u) && new RegExp(`\\b${u}\\b`).test(title)))) s += 0.35;
  return s;
}
const CATEGORY = {
  notes: /worksheet|notes|class/, worksheet: /worksheet|notes|class/,
  test: /past papers?|papers?|tests?|exams?|mocks?/, answers: /worksheet|homework|exercise|answers|classwork/,
};
function suggestFolder(folders, r) {
  const topics = r.topicIds.map(topicOf).filter(Boolean);
  let best = null;
  for (const f of folders) for (const t of topics) {
    const s = topicScore(f.title, t);
    if (s >= 0.6 && (!best || s > best.s)) best = { s, f };
  }
  if (best) return { key: 'id:' + best.f.id, why: 'Your folder for this topic.' };
  if (r.mode === 'worksheet') {
    if (topics[0]) return { key: 'new', title: `${topics[0].name} (${unitShort(topics[0].unit)})`, why: 'No folder for this topic yet, so one is made.' };
    return { key: 'subject', why: 'Pick a topic above to file it in the topic\'s folder.' };
  }
  if (r.homeworkId) {
    const hw = folders.find((f) => /homework|assignment/.test(norm(f.title)));
    if (hw) return { key: 'id:' + hw.id, why: 'Your homework folder.' };
  }
  const cat = folders.find((f) => CATEGORY[r.kind]?.test(norm(f.title)));
  if (cat) return { key: 'id:' + cat.id, why: `Your folder for ${(KINDS[r.kind] || 'work').toLowerCase()}.` };
  if (topics[0]) return { key: 'new', title: `${topics[0].name} (${unitShort(topics[0].unit)})`, why: 'No folder fits yet, so one is made for the topic.' };
  return { key: 'subject', why: '' };
}
let destToken = 0;
async function planDestination() {
  const w = APP.work, r = w.review;
  if (!r || !APP.mcp || (allFromDrive(w) && keepsDriveFile(w))) return;
  const token = ++destToken;
  // answers go into their worksheet's own folder, when it has one
  const ws = r.mode === 'answers' ? worksheetOf(r.worksheetId) : null;
  if (ws?.folderId) {
    w.dest = { status: 'ready', fixed: true, folderId: ws.folderId, path: ws.folder || ws.title, subjectId: r.subjectId };
    return render();
  }
  const keep = w.dest?.status === 'ready' && w.dest.subjectId === r.subjectId ? w.dest.userChoice : null;
  w.dest = { status: 'loading' };
  render();
  try {
    const root = await driveRoot();
    const s = subjectOf(r.subjectId);
    const top = root.id ? await listFolders(root.id) : [];
    const subjectDir = s ? matchSubject(top, s) : top.find((f) => norm(f.title) === 'general') || null;
    const inside = subjectDir ? await listFolders(subjectDir.id) : [];
    const sug = suggestFolder(inside, r);
    const options = inside.map((f) => ({ key: 'id:' + f.id, id: f.id, title: f.title }));
    if (sug.key === 'new') options.push({ key: 'new', id: null, title: sug.title, isNew: true });
    options.push({ key: 'subject', id: subjectDir?.id || null, title: '', isSubject: true });
    if (token !== destToken) return;
    w.dest = { status: 'ready', root, subjectId: r.subjectId, subjectDir, subjectTitle: subjectDir?.title || s?.name || 'General',
      options, choice: keep && options.some((o) => o.key === keep) ? keep : sug.key, userChoice: keep, why: sug.why };
  } catch (e) {
    if (token === destToken) w.dest = { status: 'error', error: 'Could not look in Google Drive: ' + connError(e, DRIVE) };
  }
  render();
}
// Turn the chosen option into a folder id, creating only what is missing.
async function resolveDestination() {
  const d = APP.work.dest;
  if (d?.status !== 'ready') throw { code: 'tool_error', message: d?.error || 'Drive is still being checked — try again in a moment.' };
  if (d.fixed) return { id: d.folderId, path: [d.path] };
  let root = d.root;
  if (!root.id) {
    root = { ...root, id: await makeFolder(root.title, null) };
    LS.set('driveRoot', root);
    FOLDERS[root.id] = [];
  }
  let subjectId = d.subjectDir?.id;
  if (!subjectId) {
    subjectId = await makeFolder(d.subjectTitle, root.id);
    (FOLDERS[root.id] ||= []).push({ id: subjectId, title: d.subjectTitle });
    FOLDERS[subjectId] = [];
  }
  const o = d.options.find((x) => x.key === d.choice) || { isSubject: true };
  const path = [root.title, d.subjectTitle];
  if (o.isSubject) return { id: subjectId, path };
  if (o.id) return { id: o.id, path: [...path, o.title] };
  const id = await makeFolder(o.title, subjectId);
  (FOLDERS[subjectId] ||= []).push({ id, title: o.title });
  return { id, path: [...path, o.title] };
}
// The Drive connector documents folders as "set the mime type to the folder
// type" without saying which of its two mime fields that is, so try the
// current one first and fall back to the older one.
async function makeFolder(name, parentId) {
  const base = { title: name, ...(parentId ? { parentId } : {}) };
  let res = await drive('create_file', { ...base, contentMimeType: FOLDER_MIME }).catch((e) => {
    if (e?.code === 'tool_error') return null;
    throw e;
  });
  if (!res || (res.mimeType && res.mimeType !== FOLDER_MIME)) {
    res = await drive('create_file', { ...base, mimeType: FOLDER_MIME });
  }
  if (!res?.id) throw { code: 'tool_error', message: 'Google Drive did not create the folder.' };
  return res.id;
}
async function toBase64(blob) {
  const u = new Uint8Array(await blob.arrayBuffer());
  let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000));
  return btoa(s);
}
async function uploadBlob(blob, title, mime, ext, parentId) {
  const input = { title, parentId, contentMimeType: mime, disableConversionToGoogleType: true };
  if (APP.fileArgs) input.base64Content = { $file: { data: blob, name: 'work.' + ext, type: mime } };
  else {
    if (blob.size > 740000) throw { code: 'too_big', message: 'That file is too big to send from this view. Try fewer pages.' };
    input.base64Content = await toBase64(blob);
  }
  const res = await drive('create_file', input);
  if (!res?.id) throw { code: 'tool_error', message: 'Google Drive did not accept the file.' };
  return { id: res.id, url: res.viewUrl || `https://drive.google.com/file/d/${res.id}/view` };
}

const PICKABLE = (m) => /^image\//.test(m) || m === 'application/pdf'
  || m === 'application/vnd.google-apps.document' || m === 'application/vnd.google-apps.presentation';

  const res = await drive('search_files', { query, pageSize: 100, excludeContentSnippets: true });
  return (res.files || []).filter((f) => f.mimeType === FOLDER_MIME || PICKABLE(f.mimeType))
    .sort((a, b) => (b.mimeType === FOLDER_MIME) - (a.mimeType === FOLDER_MIME)
      || (a.mimeType === FOLDER_MIME ? String(a.title).localeCompare(String(b.title)) : String(b.modifiedTime || '').localeCompare(String(a.modifiedTime || ''))));
}
