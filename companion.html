          <small>${f.mimeType === FOLDER_MIME ? '' : esc(fmtDay(String(f.modifiedTime || '').slice(0, 10) || nowISO()))}</small></button>`).join('')
          || '<div class="empty" style="padding:12px">Nothing here you can add — photos, PDFs and Google Docs show up.</div>'}</div>`}`);
}
// The connector hands the file back as base64; where it puts it is not
// documented, so look in the likely places.
function driveBytes(r) {
  const p = r?.payload ?? r?.structuredContent;
  const pick = (o) => o && typeof o === 'object'
    && ['content', 'data', 'base64Content', 'contents', 'bytes', 'blob', 'fileContent'].map((k) => o[k]).find((v) => typeof v === 'string' && v.length > 16);
  let b64 = typeof p === 'string' ? p : pick(p) || pick(p?.file);
  if (!b64) for (const b of r?.content || []) {
    if (b.type === 'image' && b.data) { b64 = b.data; break; }
    if (b.type === 'resource' && b.resource?.blob) { b64 = b.resource.blob; break; }
    if (b.type === 'text' && /^[A-Za-z0-9+/=\s]{40,}$/.test(b.text || '')) { b64 = b.text; break; }
  }
  if (!b64) return null;
  b64 = b64.replace(/^data:[^,]*,/, '').replace(/\s+/g, '');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function driveTake(f) {
  const c = SHEET.ctx;
  c.busy = `Getting “${f.title}”…`;
  renderDrivePicker();
  try {
    const native = f.mimeType.startsWith('application/vnd.google-apps.');
    const r = await APP.mcp.callTool(DRIVE, 'download_file_content',
      { fileId: f.id, ...(native ? { exportMimeType: 'application/pdf' } : {}) }, { cache: false });
    const bytes = driveBytes(r);
    if (!bytes?.length) throw { code: 'tool_error', message: 'Google Drive sent the file back in a form this page cannot read.' };
    const type = native ? 'application/pdf' : f.mimeType;
    const name = native ? `${f.title}.pdf` : f.title;
    const file = new File([bytes], name, { type });
    closeSheet();
    APP.tab = 'work';
    await addFiles([file], { drive: { id: f.id, title: f.title, url: f.viewUrl || `https://drive.google.com/file/d/${f.id}/view`, mime: type } });
  } catch (e) {
    if (SHEET.ctx !== c) return;
    c.busy = null; c.error = 'Could not get that file: ' + connError(e, DRIVE);
    renderDrivePicker();
  }
}

/* A tiny PDF writer: several photos become one file, one page per photo, the
   JPEG bytes embedded as they are. Keeps each piece of work to one Drive file. */
async function jpegsToPdf(images) {
  const enc = new TextEncoder();
  const chunks = [], offsets = [];
  let len = 0;
  const put = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
  const n = images.length;
  const kids = images.map((_, i) => `${3 + i * 3} 0 R`).join(' ');
  put('%PDF-1.4\n');
  offsets[1] = len; put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = len; put(`2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${n} >>\nendobj\n`);
  for (let i = 0; i < n; i++) {
    const { blob, w, h } = images[i];
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const W = 595, H = Math.round(595 * h / w);
    const p = 3 + i * 3, im = p + 1, ct = p + 2;
    const draw = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    offsets[p] = len;
    put(`${p} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
    offsets[im] = len;
    put(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);
    put(bytes); put('\nendstream\nendobj\n');
    offsets[ct] = len;
    put(`${ct} 0 obj\n<< /Length ${draw.length} >>\nstream\n${draw}\nendstream\nendobj\n`);
  }
  const count = 3 + n * 3;
  const xref = len;
  put(`xref\n0 ${count}\n0000000000 65535 f \n` + offsets.slice(1).map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  put(`trailer\n<< /Size ${count} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });
}

// What goes to Drive: a single photo as it is, several photos as one PDF, and
// any PDF you picked unchanged.
async function uploadsFor(pages) {
  const photos = pages.filter((p) => p.kind === 'image').map((p) => p.images[0]);
  const pdfs = pages.filter((p) => p.kind === 'pdf');
  const out = [];
  if (photos.length === 1) out.push({ blob: photos[0].blob, mime: 'image/jpeg', ext: 'jpg' });
  if (photos.length > 1) out.push({ blob: await jpegsToPdf(photos), mime: 'application/pdf', ext: 'pdf' });
  for (const p of pdfs) out.push({ blob: p.file, mime: 'application/pdf', ext: 'pdf' });
  return out;
}

/* Claude's corrections as a Google Doc next to your answers: every question's
   mark, and for each one that lost marks, what went wrong and the right
   working. Written as HTML, which Drive turns into a Doc. */
function correctionsHtml(r, ws) {
  const got = r.questions.reduce((a, q) => a + (Number(q.marks) || 0), 0);
  const max = r.questions.reduce((a, q) => a + (Number(q.maxMarks) || 0), 0);
  const para = (t) => esc(t).replace(/\n/g, '<br>');
  const PEN = '#c8322f', TICK = '#1a8a3a';
  return `<html><head><meta charset="utf-8"></head><body style="font-family:Arial,sans-serif">
<h1>Corrections — ${esc(ws?.title || r.title)}</h1>
<p>${esc(subjectName(r.subjectId))} · ${esc(fmtDay(nowISO()))} · marked by Claude · <b style="color:${PEN}">${fmtN(got)} / ${fmtN(max)}</b></p>
${r.summary ? `<p>${para(r.summary)}</p>` : ''}
${r.questions.map((q) => {
    const ok = Number(q.marks) >= Number(q.maxMarks);
    return `<h3>Question ${esc(q.q)} — ${fmtN(q.marks)}/${fmtN(q.maxMarks)} <span style="color:${ok ? TICK : PEN}">${ok ? '✓' : '✗'}</span></h3>
${q.topicId && topicOf(q.topicId) ? `<p><i>${esc(topicOf(q.topicId).name)}</i></p>` : ''}
${!ok && q.explanation ? `<p><b style="color:${PEN}">What went wrong${q.errorType ? ` (${esc(q.errorType)})` : ''}:</b> ${para(q.explanation)}</p>` : ''}
${!ok && q.correction ? `<p><b>The right working:</b><br><span style="font-family:'Courier New',monospace">${para(q.correction)}</span></p>` : ''}`;
  }).join('\n')}
${r.nextSteps?.length ? `<h3>Next</h3><ul>${r.nextSteps.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
</body></html>`;
}
async function uploadCorrections(r, ws, folderId, stamp) {
  const res = await drive('create_file', { title: `Corrections ${stamp} — ${ws?.title || r.title}`, parentId: folderId,
    textContent: correctionsHtml(r, ws), contentMimeType: 'text/html' });
  if (!res?.id) return null;
  return res.viewUrl || `https://docs.google.com/document/d/${res.id}/edit`;
}

async function saveWork(noDrive = false) {
  const w = APP.work, r = w.review;
  const ws = r.mode === 'answers' ? worksheetOf(r.worksheetId) : null;
  w.error = null; w.driveFailed = false;
  w.stage = 'saving';
  const stamp = `${nowISO()} ${nowHM().replace(':', '.')}`;
  let info = null;
  try {
    if (!noDrive && allFromDrive(w) && keepsDriveFile(w)) {
      const f = w.pages[0].drive;
      info = { id: f.id, url: f.url, folder: 'your Drive', mime: f.mime };
    } else if (!noDrive) {
      w.progress = 'Finding your Drive folder…'; render();
      let { id: folderId, path: parts } = await resolveDestination();
      if (r.mode === 'worksheet') {
        // every worksheet gets a folder of its own: the sheet now, answers and corrections later
        w.progress = 'Making the worksheet\'s folder…'; render();
        const name = folderName(r.title);
        folderId = await makeFolder(name, folderId);
        parts = [...parts, name];
      }
      w.progress = 'Uploading to Google Drive…'; render();
      const files = await uploadsFor(keepsDriveFile(w) ? w.pages.filter((p) => !p.drive) : w.pages);
      const results = [];
      for (const [i, f] of files.entries()) {
        const n = files.length > 1 ? ` (${i + 1})` : '';
        const title = r.mode === 'worksheet' ? `Worksheet — ${r.title}${n}.${f.ext}`
          : r.mode === 'answers' ? `Answers ${stamp}${n}.${f.ext}`
          : `${stamp} · ${KINDS[r.kind] || 'Work'} · ${r.title}${n}.${f.ext}`;
        results.push(await uploadBlob(f.blob, title, f.mime, f.ext, folderId));
      }
      const folderUrl = `https://drive.google.com/drive/folders/${folderId}`;
      info = { id: results[0]?.id, url: results.length === 1 ? results[0].url : folderUrl,
        folder: parts.join(' › '), mime: files.length === 1 ? files[0].mime : 'multiple', folderId, folderUrl };
      if (r.mode === 'answers' && r.questions.length) {
        w.progress = 'Writing the corrections…'; render();
        info.correctionsUrl = await uploadCorrections(r, ws, folderId, stamp)
          .catch(() => { toast('Your answers are in Drive, but the corrections file could not be made. They are in History.'); return null; });
      }
    }
  } catch (e) {
    w.stage = 'review';
    w.driveFailed = true;
    w.error = e?.code === 'too_big' ? e.message : 'Could not save to Google Drive: ' + connError(e, DRIVE);
    return render();
  }
  w.hash ||= await hashPages(w.pages);
  w.progress = 'Updating your dashboard…'; render();
  const pages = w.pages.reduce((a, p) => a + Math.max(1, p.images.length), 0);

  if (r.mode === 'worksheet') {
    const id = newId('w');
    const questions = r.questions.map((q) => ({ q: q.q, text: q.text, maxMarks: Number(q.maxMarks) || 0, topicId: q.topicId || r.topicIds[0] || null }));
    send({ type: 'worksheet.add', summary: r.summary, questions,
      worksheet: { id, title: r.title, subjectId: r.subjectId, topicIds: r.topicIds, pages, hash: w.hash,
        folderId: info?.folderId || null, folderUrl: info?.folderUrl || null, fileId: info?.id || null,
        fileUrl: info?.url || null, folder: info?.folder || '' } });
    w.saved = { mode: 'worksheet', worksheetId: id, title: r.title, subjectId: r.subjectId, questions: questions.length,
      url: info?.folderUrl || info?.url || null, folder: info?.folder || null };
    w.stage = 'saved';
    return render();
  }

  const questions = r.questions.map((q) => ({ q: q.q, topicId: q.topicId || r.topicIds[0] || null, marks: Number(q.marks) || 0,
    maxMarks: Number(q.maxMarks) || 0, errorType: Number(q.marks) < Number(q.maxMarks) ? q.errorType || 'method' : null,
    explanation: q.explanation, correction: q.correction }));
  const kind = r.mode === 'notes' ? 'notes' : r.mode === 'answers' ? 'answers' : r.kind;
  send({
    type: 'work.save',
    attachment: { id: newId('f'), title: r.title, subjectId: r.subjectId, topicIds: r.topicIds, homeworkId: r.homeworkId || null,
      kind, worksheetId: ws?.id || null, driveId: info?.id || null, driveUrl: info?.url || null, folder: info?.folder || '',
      correctionsUrl: info?.correctionsUrl || null, mime: info?.mime || '', pages, hash: w.hash },
    notes: kind === 'notes' ? { summary: r.summary || '', keyPoints: r.keyPoints || [] } : undefined,
    marking: questions.length ? { questions, summary: r.summary, nextSteps: r.nextSteps, tier: w.tierUsed, detected: r.detected } : null,
  });
  const score = questions.reduce((a, q) => a + q.marks, 0), max = questions.reduce((a, q) => a + q.maxMarks, 0);
  const weakTopics = [...new Set(questions.filter((q) => q.marks < q.maxMarks && q.topicId).map((q) => q.topicId))];
  w.saved = { mode: r.mode, title: r.title, subjectId: r.subjectId, topicIds: r.topicIds, score, max, summary: r.summary,
    nextSteps: r.nextSteps || [], keyPoints: r.keyPoints || [], worksheetId: ws?.id || null, correctionsUrl: info?.correctionsUrl || null,
    url: info?.url || null, folder: info?.folder || null, weakTopics };
  w.stage = 'saved';
  render();
}

function topicSuggest() {
  const host = $('#rTopicSuggest'), input = $('#rTopicSearch');
  if (!host || !input) return;
  const q = input.value.trim().toLowerCase();
  if (!q) { host.innerHTML = ''; return; }
  const r = APP.work.review || SHEET.ctx?.test;
  host.innerHTML = `<div class="suggest">${searchTopics(q, r.subjectId, r.topicIds).map((t) =>
    `<button data-act="topic-add" data-id="${esc(t.id)}">${esc(t.name)} <small>${esc(subjectName(t.subjectId))} · ${esc(unitShort(t.unit))}</small></button>`).join('')
    || '<div class="empty" style="padding:8px 10px">No topic matches that.</div>'}</div>`;
}
// Loose matching, so "quadratcs" and "diff eq" still find their topics.
function searchTopics(q, subjectId, exclude = []) {
  const words = q.split(/\s+/).filter(Boolean);
  const score = (t) => {
    const hay = (t.name + ' ' + t.unit).toLowerCase();
    const tokens = hay.split(/[^a-z0-9]+/).filter(Boolean);
    let s = 0;
    for (const w of words) {
      if (hay.includes(w)) s += 3;
      else if (tokens.some((tk) => tk.startsWith(w.slice(0, 4)) || (w.length >= 5 && osa(w, tk.slice(0, w.length + 1)) <= 2))) s += 2;
      else return 0;
    }
    return s + (t.subjectId === subjectId ? 1 : 0);
  };
  return (APP.data?.topics || []).filter((t) => !exclude.includes(t.id))
    .map((t) => [t, score(t)]).filter(([, s]) => s > 0).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([t]) => t);
}

  }

function attemptSheet(a, full, loading = false) {
  if (!a) return '<div class="empty">That piece of work is gone.</div>';

  const canCheck = Boolean(APP.sample && APP.limits?.images);
  const notes = (full?.notes || []);
  const ws = a.worksheetId ? worksheetOf(a.worksheetId) : null;
  const back = SHEET.ctx?.fromWs && worksheetOf(SHEET.ctx.fromWs);
  return `<div class="sheet-h">${back ? `<button class="btn ghost sm" data-act="open-ws" data-id="${esc(back.id)}">‹ Worksheet</button>` : ''}

      <span class="stamp sm">${fmtN(a.score)}<small>/${fmtN(a.max)}</small></span>
      <div style="flex:1"><div class="task-meta"><span class="dot" style="--c:${colourOf(a.subjectId)}"></span>${esc(subjectName(a.subjectId))} · ${esc(fmtDay(a.date))}</div>
        ${ws && !back ? `<div style="font-size:13.5px">Answers to <button class="btn ghost sm" style="padding:0 2px" data-act="open-ws" data-id="${esc(ws.id)}">${esc(ws.title)}</button></div>` : ''}
        <div class="row" style="gap:12px">${a.driveUrl ? `<a href="${esc(a.driveUrl)}" target="_blank" rel="noopener" style="font-size:13.5px">Your pages in Drive</a>` : ''}

    </div>

    ${loading ? '<div class="muted" style="font-size:13px;margin-bottom:8px">Fetching the explanations…</div>' : ''}

      const lost = Number(q.marksLost) > 0;
      const qn = notes.filter((n) => n.q === String(q.q));

function questionOf(q) {
  const id = SHEET.ctx?.id;
  const full = APP.details[id];
  const a = APP.data.attempts.find((x) => x.id === id);
  return { a, q: (full?.questions || a?.questions || []).find((x) => String(x.q) === String(q)) };
}
function questionContext(a, q) {
  return `Subject: ${subjectName(a.subjectId)}. Topic: ${topicOf(q.topicId)?.name || 'unknown'}. Question ${q.q} of "${a.title}", worth ${q.max} marks; the student got ${q.marks}.
Why it was marked wrong: ${q.explanation || '(not recorded)'}
The correct working: ${q.correction || '(not recorded)'}`;
}
async function explainMore(qKey) {
  const { a, q } = questionOf(qKey);
  const out = document.getElementById('qx-' + qKey);
  if (!a || !q || !out) return;
  out.innerHTML = '<div class="q-text">Thinking…</div>';
  try {
    const { text } = await APP.sample(`You are a patient A Level tutor. A Year 12 student got this question wrong and wants to understand it.
${questionContext(a, q)}

Explain it step by step in plain language, in under 180 words: what the question wants, the key idea, each step, and the trap the student fell into. Use plain text; write maths inline like x^2.`,
    { modelTier: 'quick', cache: { gcTime: 86400000 }, onText: ({ text }) => { out.innerHTML = `<div class="q-text" style="white-space:pre-wrap">${esc(text)}</div>`; } });
    send({ type: 'attempt.note', attemptId: a.id, q: q.q, kind: 'explain', text });
    const full = APP.details[a.id];
    if (full) (full.notes ||= []).push({ q: String(q.q), text, kind: 'explain' });
  } catch (e) { out.innerHTML = `<div class="notice bad">${esc(sampleError(e))}</div>`; }
}
async function checkRedo(qKey, file) {
  const { a, q } = questionOf(qKey);
  const out = document.getElementById('qx-' + qKey);
  if (!a || !q || !out) return;
  out.innerHTML = '<div class="q-text">Reading your redo…</div>';
  try {
    const img = await downscale(file);
    const r = await APP.sample.json(`A Year 12 student has redone a question they got wrong. The photo shows the redo.
${questionContext(a, q)}

Check the redo. Is the final answer right and the method sound? Reply with only JSON: {"correct": true, "feedback": "one or two sentences to the student"}`,
    { images: [img.blob], modelTier: APP.work.tier === 'careful' ? 'default' : 'quick' });
    URL.revokeObjectURL(img.url);
    const ok = r?.correct === true;
    const feedback = String(r?.feedback || (ok ? 'Correct.' : 'Not quite yet.'));
    out.innerHTML = `<div class="notice${ok ? '' : ' bad'}">${ok ? '<b>Right.</b> ' : '<b>Not yet.</b> '}${esc(feedback)}</div>`;
    send({ type: 'attempt.note', attemptId: a.id, q: q.q, kind: 'check', text: (ok ? 'Correct. ' : 'Not yet. ') + feedback });
    if (ok) {
      send({ type: 'mistake.resolve', attemptId: a.id, q: q.q, how: 'checked' });
      q.resolved = 'checked';
      setTimeout(() => { if (SHEET.ctx?.id === a.id) $('#sheet').innerHTML = attemptSheet(APP.data.attempts.find((x) => x.id === a.id), APP.details[a.id]); }, 1600);
    }
  } catch (e) { out.innerHTML = `<div class="notice bad">${esc(sampleError(e))}</div>`; }
}

/* ---------------------------------------------------------- app-like
   Claude's own bar sits outside this page, so the page cannot hide it — but
   where the browser allows it (a Mac, an iPad) the page can go full screen,
   and on a phone the header slides away while you scroll down. */
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
const fsAllowed = () => Boolean(document.fullscreenEnabled || document.webkitFullscreenEnabled);
async function toggleFullscreen() {
  try {
    if (fsElement()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else {
      const root = document.documentElement;
      await (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    }
  } catch { toast('Full screen is not allowed here.'); }
}
function syncFullscreen() {
  const b = $('#fsBtn');
  if (!b) return;
  b.hidden = !fsAllowed();
  b.setAttribute('aria-pressed', String(Boolean(fsElement())));
  b.setAttribute('aria-label', fsElement() ? 'Leave full screen' : 'Full screen');
}
document.addEventListener('fullscreenchange', syncFullscreen);
document.addEventListener('webkitfullscreenchange', syncFullscreen);

let lastY = 0;
window.addEventListener('scroll', () => {
  const y = Math.max(0, window.scrollY), h = $('header.top');
  const keep = matchMedia('(min-width:820px)').matches || !$('#sheet').hidden;
  if (keep || y < 60 || y < lastY - 8) h.classList.remove('hide');
  else if (y > lastY + 8) h.classList.add('hide');
  if (Math.abs(y - lastY) > 8 || y < 60) lastY = y;
}, { passive: true });

let toastTimer = null;
function toast(text) {
  const t = $('#toast');
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ================================================================ events */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-act]');
  if (!t) { if (e.target.id === 'scrim') closeSheet(); return; }
  if (t.dataset.tab && !t.dataset.act) { APP.tab = t.dataset.tab; LS.set('tab', APP.tab); window.scrollTo(0, 0); $('header.top').classList.remove('hide'); return render(); }
  const act = t.dataset.act;
  const d = APP.data;
  switch (act) {
    case 'tab': APP.tab = t.dataset.tab; LS.set('tab', APP.tab); window.scrollTo(0, 0); return render();
    case 'status': return statusSheet();
    case 'fullscreen': return toggleFullscreen();
    case 'retry': closeSheet(); refresh(); return flush();
    case 'root-save': {
      const name = $('#rootName')?.value.trim();
      if (!name) return;
      LS.set('driveRootName', name); LS.set('driveRoot', null);
      for (const k of Object.keys(FOLDERS)) delete FOLDERS[k];
      toast(`Work will be filed under “${name}”.`);
      return closeSheet();
    }
    case 'close': return closeSheet();

    /* today */
    case 'day': APP.selDay = t.dataset.date === d.date ? null : t.dataset.date; return render();
    case 'choose': {
      const { date, key } = t.dataset;
      const sp = studySlots(date).find((s) => s.key === key);
      const o = sp?.options[Number(t.dataset.i)];
      if (!o) return;
      // choosing for a period that is already over is logging it: ask how it went
      const over = Boolean(t.closest('.slot')?.classList.contains('past'));
      send({ type: 'study.choose', date, key, option: o });
      if (over) doneSheet(date, key);
      return;
    }
    case 'study-change': return send({ type: 'study.choose', date: t.dataset.date, key: t.dataset.key, option: null });
    case 'study-done': return doneSheet(t.dataset.date, t.dataset.key);
    case 'study-undo': return send({ type: 'study.undo', date: t.dataset.date, key: t.dataset.key });
    case 'study-custom': return customSheet(t.dataset.date, t.dataset.key);
    case 'custom-save': {
      const c = SHEET.ctx, title = $('#cTitle')?.value.trim();
      if (!title) return $('#cTitle')?.focus();
      const sp = studySlots(c.date).find((s) => s.key === c.key);
      const option = { id: newId('custom:'), kind: 'custom', title, why: 'your own plan', subjectId: $('#cSubj')?.value || null,
        topicId: null, taskId: null, testId: null, mins: sp?.mins || 45 };
      send({ type: 'study.choose', date: c.date, key: c.key, option });
      if (c.past) return doneSheet(c.date, c.key);
      return closeSheet();
    }
    case 'log-all': return logSheet();
    case 'slot-new': return slotSheet(t.dataset.date);
    case 'slot-save': {
      const c = SHEET.ctx, start = $('#slStart')?.value;
      if (!/^\d{2}:\d{2}$/.test(start || '')) return $('#slStart')?.focus();
      const minutes = Number($('#slMins')?.value) || 60;
      if (studySlots(c.date).some((x) => x.key === 'x' + start)) { toast('There is already a session starting then.'); return; }
      send({ type: 'study.slot.add', date: c.date, start, minutes, title: $('#slTitle')?.value.trim() || undefined });
      closeSheet();
      return toast(`Added ${fmtDay(c.date)} ${start}. Suggestions appear in a moment.`);
    }
    case 'slot-remove':
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again'; return; }
      return send({ type: 'study.slot.remove', date: t.dataset.date, key: t.dataset.key });
    case 'drive-pick': return openDrivePicker();
    case 'dv-back': {
      const c = SHEET.ctx;
      if (c.search) return driveGo();
      c.stack.pop();
      return driveGo();
    }
    case 'dv-open': {
      const c = SHEET.ctx, f = c.items?.[Number(t.dataset.i)];
      if (!f) return;
      if (f.mimeType === FOLDER_MIME) { c.stack.push({ id: f.id, title: f.title }); return driveGo(); }
      return driveTake(f);
    }
    case 'done-save': {
      const c = SHEET.ctx;
      send({ type: 'study.done', date: c.date, key: c.key, minutes: Number($('#dMins')?.value) || undefined,
        confidence: c.conf ?? undefined, note: $('#dNote')?.value.trim() || undefined, taskDone: Boolean($('#dTask')?.checked) });
      if ($('#dTask')?.checked) {
        const o = studySlots(c.date).find((s) => s.key === c.key)?.chosen;
        if (o?.taskId) applyLocal({ type: 'task.done', taskId: o.taskId, done: true });
      }
      closeSheet(); return render();
    }
    case 'task-done': {
      const done = d.done.some((x) => x.id === t.dataset.id);
      return send({ type: 'task.done', taskId: t.dataset.id, done: !done });
    }
    case 'task-edit': return taskSheet(t.dataset.id);
    case 'task-save': {
      const id = SHEET.ctx.id;
      const prio = $('#tPrio [aria-pressed="true"]')?.dataset.prio || 'normal';
      send({ type: 'task.update', taskId: id, patch: { title: $('#tTitle').value.trim() || undefined, subjectId: $('#tSubj').value,
        due: $('#tDue').value || null, priority: prio, notes: $('#tNote').value } });
      return closeSheet();
    }
    case 'task-delete':
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to delete'; return; }
      send({ type: 'task.delete', taskId: SHEET.ctx.id });
      return closeSheet();

    /* work */
    case 'pick': return document.getElementById(t.dataset.input).click();
    case 'page-remove': APP.work.pages.splice(Number(t.dataset.i), 1); APP.work.already = null; return render();
    case 'work-analyse': return analyse(t.dataset.force === '1');
    case 'work-file-only': return fileOnly();
    case 'work-stop': APP.work.ctl?.abort(); return;
    case 'work-back': APP.work.stage = 'idle'; APP.work.error = null; return render();
    case 'work-reset': return resetWork();
    case 'work-save': return saveWork(t.dataset.nodrive === '1');
    case 'topic-add': {
      const ctx = APP.work.stage === 'review' && SHEET.ctx?.kind !== 'test' ? APP.work.review : SHEET.ctx?.test;
      if (ctx && !ctx.topicIds.includes(t.dataset.id)) ctx.topicIds.push(t.dataset.id);
      if (SHEET.ctx?.kind === 'test') { readTestFields(); return renderTestSheet(); }
      $('#rTopicSearch').value = '';
      return planDestination();
    }
    case 'topic-remove': {
      if (SHEET.ctx?.kind === 'test') { readTestFields(); SHEET.ctx.test.topicIds = SHEET.ctx.test.topicIds.filter((x) => x !== t.dataset.id); return renderTestSheet(); }
      APP.work.review.topicIds = APP.work.review.topicIds.filter((x) => x !== t.dataset.id);
      return planDestination();
    }

    /* history */
    case 'hview': APP.history.view = t.dataset.v; return render();
    case 'open-attempt': return openAttempt(t.dataset.id, t.dataset.q, t.dataset.from);
    case 'open-ws': return openWorksheet(t.dataset.id);
    case 'open-note': return noteSheet(t.dataset.id);
    case 'ws-answers': return startAnswers(t.dataset.id);
    case 'ws-plan': return planSheet(t.dataset.id);
    case 'ws-plan-pick': return planWorksheet(SHEET.ctx?.wid, t.dataset.date, t.dataset.key);
    case 'ws-delete':
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to delete'; return; }
      send({ type: 'worksheet.delete', worksheetId: SHEET.ctx.id });
      closeSheet();
      return toast('Worksheet deleted. Its Drive folder and your marked answers are kept.');
    case 'note-delete':
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to remove'; return; }
      send({ type: 'attachment.delete', attachmentId: SHEET.ctx.id });
      return closeSheet();
    case 'fix': {
      send({ type: 'mistake.resolve', attemptId: SHEET.ctx.id, q: t.dataset.q, how: 'self' });
      const { q } = questionOf(t.dataset.q);
      if (q) q.resolved = 'self';
      $('#sheet').innerHTML = attemptSheet(APP.data.attempts.find((x) => x.id === SHEET.ctx.id), APP.details[SHEET.ctx.id]);
      return;
    }
    case 'explain': return explainMore(t.dataset.q);
    case 'check-redo': { const f = $('#fileRedo'); f.dataset.q = t.dataset.q; f.value = ''; return f.click(); }
    case 'remark': return remarkForm(t.dataset.q);
    case 'remark-save': {
      const { a, q } = questionOf(t.dataset.q);
      const marks = Math.min(Number(q.max), Math.max(0, Number($('#rm-' + t.dataset.q)?.value) || 0));
      send({ type: 'attempt.update', attemptId: a.id, questions: [{ q: q.q, marks }] });
      delete APP.details[a.id];
      closeSheet();
      return toast('Marks corrected — your level updates in a moment.');
    }

    /* skills */
    case 'skills-open': APP.skillsOpen = APP.skillsOpen === t.dataset.id ? null : t.dataset.id; return render();
    case 'test-new': return testSheet(null);
    case 'test-edit': return testSheet(t.dataset.id);
    case 'unit-add': {
      readTestFields();
      const tt = SHEET.ctx.test;
      for (const x of APP.data.topics) if (x.subjectId === tt.subjectId && x.unit === t.dataset.unit && !tt.topicIds.includes(x.id)) tt.topicIds.push(x.id);
      return renderTestSheet();
    }
    case 'test-save': {
      readTestFields();
      const tt = SHEET.ctx.test;
      if (!tt.title || !tt.date) { toast('Give the test a name and a date.'); return; }
      if (SHEET.ctx.isNew) send({ type: 'test.add', test: tt });
      else send({ type: 'test.update', testId: tt.id, patch: { title: tt.title, subjectId: tt.subjectId, date: tt.date, kind: tt.kind, topicIds: tt.topicIds } });
      return closeSheet();
    }
    case 'test-delete':
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to delete'; return; }
      send({ type: 'test.delete', testId: SHEET.ctx.test.id });
      return closeSheet();
    case 'test-result': {
      const mark = Number($('#tm-' + t.dataset.id)?.value), total = Number($('#tt-' + t.dataset.id)?.value);
      if (!(total > 0) || !(mark >= 0) || mark > total) return toast('Enter your mark and what it was out of.');
      return send({ type: 'test.result', testId: t.dataset.id, mark, total });
    }
  }

  /* segmented controls inside sheets and the work form */
  if (t.dataset.prio) { t.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); return; }
  if (t.dataset.conf) { SHEET.ctx.conf = Number(t.dataset.conf); t.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); return; }
  if (t.dataset.kind && SHEET.ctx?.kind === 'test') { SHEET.ctx.test.kind = t.dataset.kind; t.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); return; }
  if (t.dataset.tier) { readWorkForm(); APP.work.tier = t.dataset.tier; LS.set('tier', APP.work.tier); return render(); }
  if (t.dataset.mode) {
    readWorkForm();
    Object.assign(APP.work, { mode: t.dataset.mode, already: null, error: null });
    LS.set('workMode', t.dataset.mode);
    return render();
  }
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'qaForm') quickAdd();
  if (e.target.id === 'dvForm') { const q = $('#dvSearch')?.value.trim(); if (q) driveGo(q); else driveGo(); }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'qaText') return updateQuickPreview();
  if (el.id === 'rTopicSearch') return topicSuggest();
  if (el.id === 'rTitle' && APP.work.review) { APP.work.review.title = el.value; return; }
  if (el.id === 'rSummary' && APP.work.review) { APP.work.review.summary = el.value; return; }
  if (el.id === 'rPoints' && APP.work.review) { APP.work.review.keyPoints = el.value.split('\n').map((x) => x.trim()).filter(Boolean); return; }
  if (el.dataset.qf && APP.work.review) {
    const q = APP.work.review.questions[Number(el.dataset.i)];
    if (!q) return;
    q[el.dataset.qf] = el.dataset.qf === 'marks' || el.dataset.qf === 'maxMarks' ? Number(el.value) : el.value;
  }
});

document.addEventListener('change', async (e) => {
  const el = e.target;
  const r = APP.work.review;
  if (['fileCamera', 'filePhotos', 'fileAny'].includes(el.id) && el.files?.length) { await addFiles([...el.files]); el.value = ''; return; }
  if (el.id === 'fileRedo' && el.files?.[0]) return checkRedo(el.dataset.q, el.files[0]);
  if (el.id === 'wSubj') { APP.work.hint.subjectId = el.value; APP.work.hint.homeworkId = ''; return render(); }
  if (el.id === 'wHw') { APP.work.hint.homeworkId = el.value; return; }
  if (el.id === 'wSheet') { APP.work.worksheetId = el.value; APP.work.already = null; return; }
  if (el.id === 'hSubj') { APP.history.subject = el.value; return render(); }
  if (el.id === 'xSubj' && SHEET.ctx?.kind === 'test') { readTestFields(); SHEET.ctx.test.topicIds = []; return renderTestSheet(); }
  if (!r) return;
  if (el.id === 'rSubj') { r.subjectId = el.value; r.topicIds = r.topicIds.filter((id) => topicOf(id)?.subjectId === el.value); return planDestination(); }
  if (el.id === 'rKind') { r.kind = el.value; return planDestination(); }
  if (el.id === 'rHw') { r.homeworkId = el.value; return planDestination(); }
  if (el.id === 'rDest' && APP.work.dest) { APP.work.dest.choice = APP.work.dest.userChoice = el.value; return render(); }
  if (el.dataset.qf) {
    const q = r.questions[Number(el.dataset.i)];
    if (q) { q[el.dataset.qf] = el.dataset.qf === 'marks' || el.dataset.qf === 'maxMarks' ? Number(el.value) : el.value; render(); }
  }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* =================================================================== boot */
async function boot() {
  syncFullscreen();
  render();
  if (window.claude?.use) {
    const [mcp, sample] = await Promise.all([claude.use('mcp'), claude.use('sample')].map((p) => p.catch(() => null)));
    APP.mcp = mcp; APP.sample = sample;
    if (sample) APP.limits = await sample.limits().catch(() => null);
    if (mcp) {
      try {
        const l = await mcp.listTools();
        APP.fileArgs = Boolean(l?.fileArgs);
        const mine = (l?.servers || []).find((s) => s.server.toLowerCase().replace(/\s+/g, ' ').trim() === 'a level dashboard');
        if (mine) DASH = mine.server;
      } catch { /* listing is advisory */ }
      APP.transport = TRANSPORT.mcp;
      APP.mode = 'claude';
    } else {
      APP.mode = 'claude-no-mcp';
      setStatus('setup', APP.data ? 'Showing your last sync — connectors are off in this view' : 'Connectors are off in this view');
    }
  } else {
    APP.transport = TRANSPORT.rest;
    APP.mode = 'web';
  }
  render();
  await refresh();
  flush();
  // the progress bar and "now" move with the clock; the day itself refreshes
  // every few minutes and whenever you come back to the app
  let ticks = 0;
  setInterval(() => {
    if (document.hidden) return;
    if (++ticks % 10 === 0) refresh(); else if (APP.tab === 'today' && $('#sheet').hidden && !document.activeElement?.matches('input, textarea, select')) render();
  }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); flush(); } });
}
boot();
</script>
