# Render blueprint. Point Render at this repo and it reads this file.
services:
  - type: web
    name: school-dashboard
    runtime: node
    plan: free                 # sleeps after 15 min idle; "starter" (~$7/mo) stays warm
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /api/session
    envVars:
      - key: DASHBOARD_PASSWORD    # set this yourself — without it the dashboard is public
        sync: false
      # Your profile is deliberately not in the repo, so a host cannot see it.
      # Add it as a Render Secret File (Settings → Secret Files) named
      # profile.json and point this at it. Without it the host keeps whatever
      # school data is already in the database, but a schema bump can no longer
      # refresh your calendar or rota.
      - key: PROFILE_PATH          # e.g. /etc/secrets/profile.json
        sync: false
      - key: SESSION_SECRET        # generated once; keeps you signed in across restarts
        generateValue: true
      - key: APP_TOKEN            # the companion app's key: generated once, then pasted into the
        generateValue: true       # claude.ai connector URL (…/mcp/<APP_TOKEN>). See DEPLOY.md.
      - key: TZ                   # your time zone, e.g. Europe/London — so "today" on the server is
        sync: false               # your day when Claude chat asks the connector without a date
      - key: ANTHROPIC_API_KEY    # powers the Claude features; without it they hide themselves
        sync: false
      - key: CLAUDE_MODEL          # optional — defaults to claude-haiku-4-5, the cheapest
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: CLASSROOM_CLIENT_ID
        sync: false
      - key: CLASSROOM_CLIENT_SECRET
        sync: false
      - key: CLASSROOM_REFRESH_TOKEN
        sync: false
      - key: GMAIL_CLIENT_ID          # personal account — reads forwarded Classroom mail
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-dashboard-db
          property: connectionString

databases:
  - name: school-dashboard-db
    plan: free                 # free Postgres expires after 90 days — see DEPLOY.md
