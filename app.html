<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Level">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="manifest" href="/icons/manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>A Level Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f7f7f5; --surface-1:#fcfcfb; --surface-2:#f0efec; --line:#e2e1dc; --line-strong:#cfcec8;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#84837c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --radius:11px; --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 16px -6px rgba(0,0,0,.07);
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#141413; --surface-1:#1a1a19; --surface-2:#242422; --line:#302f2c; --line-strong:#43423e;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8e8d84;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141413; --surface-1:#1a1a19; --surface-2:#242422; --line:#302f2c; --line-strong:#43423e;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8e8d84;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 16px -6px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
/* display:flex on .row would otherwise beat the UA's [hidden] rule */
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text-primary);
  font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  font-feature-settings:'ss01','cv05'}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-family:var(--sans);color:var(--text-primary);background:var(--surface-1);
  border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--s1);outline-offset:-1px;border-color:transparent}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-bottom:22px}
.top-in{max-width:1180px;margin:0 auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:19px;letter-spacing:-.03em}
.brand .sub{color:var(--text-muted);font-size:13px}
.spacer{flex:1}
.tabwrap{position:relative}
.tabwrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:36px;pointer-events:none;
  background:linear-gradient(to right,transparent,var(--bg));opacity:.9}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:9px 13px;border-bottom:2px solid transparent;
  color:var(--text-secondary);font-size:14px;white-space:nowrap;border-radius:6px 6px 0 0}
nav.tabs button:hover{color:var(--text-primary);background:var(--surface-2)}
nav.tabs button[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--s1);font-weight:550}

.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);
  padding:19px 20px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin-bottom:2px}
.card .hint{color:var(--text-muted);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(198px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.view{display:none}.view.active{display:block}

/* ---------- bits ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;
  font-size:12px;font-weight:550;background:var(--surface-2);color:var(--text-secondary);
  border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.btn{background:var(--surface-1);border:1px solid var(--line-strong);border-radius:8px;
  padding:7px 13px;font-size:14px;font-weight:500;transition:background .12s,border-color .12s,transform .08s}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--text-muted);padding:5px 8px}
.btn.ghost:hover{background:var(--surface-2);color:var(--text-primary)}
.btn.sm{padding:4px 9px;font-size:13px}
.empty{color:var(--text-muted);font-size:13.5px;padding:22px 4px;text-align:center;line-height:1.65}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:550;color:var(--text-muted);font-size:12px;text-transform:uppercase;
  letter-spacing:.04em;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num,.stat .value,.block-min,.qmeta,.hbar+*{font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-size:13.5px}
.stat .value{font-family:var(--mono);letter-spacing:-.03em}
.stat .label,.uni-label,.cardface-meta,th,.chip,.pill,.block-min span{font-family:var(--mono)}
th{font-size:10.5px}

.stat{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;transition:border-color .12s}
.stat:hover{border-color:var(--line-strong)}
.stat .label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.stat .value{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .foot{font-size:12.5px;color:var(--text-secondary);margin-top:3px}

.status{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:550}
.status.good{color:var(--good)} .status.warn{color:var(--serious)} .status.bad{color:var(--critical)}

/* ---------- revision queue ---------- */
.queue{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.qrow{display:grid;grid-template-columns:4px 1fr auto auto;gap:12px;align-items:center;
  background:var(--surface-1);padding:11px 14px 11px 0}
.qrow:hover{background:var(--surface-2)}
.qbar{height:100%;min-height:42px;border-radius:0 3px 3px 0}
.qname{font-weight:550;font-size:14px}
.qmeta{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.conf{display:flex;gap:3px}
.conf button{width:19px;height:19px;border-radius:5px;border:1px solid var(--line-strong);
  background:var(--surface-2);padding:0;font-size:10px;color:var(--text-muted)}
.conf button.on{background:var(--s1);border-color:var(--s1);color:#fff}
.trow{display:flex;gap:9px;align-items:center;padding:4px 6px;border-radius:6px;font-size:13.5px}
.trow:hover{background:var(--surface-2)}
.trow .chip{margin-left:auto}
.subjfold{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.subjfold summary{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;
  list-style:none;font-size:14px;background:var(--surface-2)}
.subjfold summary::-webkit-details-marker{display:none}
.subjfold summary::before{content:'▸';color:var(--text-muted);font-size:11px;width:11px}
.subjfold[open] summary::before{content:'▾'}
.subjfold[open] summary{border-bottom:1px solid var(--line)}
.subjfold > div{padding:12px 13px}
.subjfold summary .chip{margin-left:auto}
.tstat{font-family:var(--mono);font-size:10px;letter-spacing:.03em;padding:3px 7px;border-radius:5px;
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text-muted);
  min-width:78px;text-align:center;flex:none}
.tstat.s1{border-color:var(--s4);color:var(--s4);background:color-mix(in srgb,var(--s4) 10%,transparent)}
.tstat.s2{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.phase{font-size:11.5px;line-height:1.5;color:var(--text-secondary);margin:8px 0 0;padding:7px 10px;
  border-radius:7px;background:var(--surface-2);border-left:3px solid var(--line-strong)}
.phase-learning{border-left-color:var(--s4)}
.phase-building{border-left-color:var(--s1)}
.phase-exam{border-left-color:var(--good)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:16px}
.cal-h{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-muted);text-align:center;padding:0 0 6px}
.cal-d{min-height:86px;border:1px solid var(--line);border-radius:7px;padding:5px 6px;
  background:var(--surface-1);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-d.empty{border:0;background:none}
.cal-d.wknd{background:var(--bg)}
.cal-d.offterm{opacity:.5}
.cal-d.hol{background:color-mix(in srgb,var(--s4) 11%,var(--surface-1));border-color:color-mix(in srgb,var(--s4) 30%,var(--line))}
.cal-d.today{border-color:var(--s1);box-shadow:inset 0 0 0 1px var(--s1)}
.cal-n{font-family:var(--mono);font-size:11px;color:var(--text-muted);text-align:right}
.cal-d.today .cal-n{color:var(--s1);font-weight:600}
.cal-e{font-size:10.5px;line-height:1.3;padding:2px 4px;border-radius:4px;background:var(--surface-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.cal-e .dot{width:6px;height:6px;border-radius:2px;flex:none}
.cal-e.due{background:color-mix(in srgb,var(--critical) 15%,transparent)}
.cal-e.done{opacity:.5;text-decoration:line-through}
.cal-e.milestone{background:color-mix(in srgb,var(--serious) 20%,transparent);font-weight:550}
.cal-e.term{background:color-mix(in srgb,var(--s1) 16%,transparent);font-weight:550}
.cal-e.paper{background:color-mix(in srgb,var(--good) 15%,transparent)}
.cal-e.holiday{background:transparent;color:var(--text-muted);font-style:italic}
.cal-e.route{background:color-mix(in srgb,var(--s5) 18%,transparent);font-weight:550}
.cal-more{font-size:9.5px;color:var(--text-muted);padding-left:4px}
.key{width:11px;height:11px;border-radius:3px;flex:none;background:var(--surface-2);border:1px solid var(--line)}
.key.hol{background:color-mix(in srgb,var(--s4) 40%,transparent)}
.key.due{background:var(--critical)}
.key.milestone{background:var(--serious)}
.key.term{background:var(--s1)}
.key.paper{background:var(--good)}
.key.route{background:var(--s5)}
@media (max-width:560px){.cal-d{min-height:58px;padding:3px 4px}.cal-e{font-size:9px}}
.spare{margin-top:11px;padding:9px 11px;border-radius:7px;background:var(--surface-2);
  border:1px dashed var(--line-strong);font-size:12px;line-height:1.55;color:var(--text-muted)}

/* ---------- whiteboard ---------- */
.wb-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.swatch{width:24px;height:24px;border-radius:6px;border:2px solid var(--line-strong);padding:0}
.swatch.on{border-color:var(--text-primary);transform:scale(1.12)}
#wbCanvas{width:100%;height:min(62vh,560px);display:block;background:var(--surface-1);
  border:1px solid var(--line-strong);border-radius:8px;touch-action:none;cursor:crosshair}

/* ---------- charts ---------- */
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.axis-line{stroke:var(--line-strong);stroke-width:1}
.grid-line{stroke:var(--line);stroke-width:1}
.tick{fill:var(--text-muted);font-size:11px}
.bar-label{fill:var(--text-primary);font-size:12px;font-weight:550}
.spark-name{fill:var(--text-secondary);font-size:11.5px;font-weight:550}
.spark-val{fill:var(--text-primary);font-size:14px;font-weight:600}
.sm-cell{background:var(--surface-1);border:1px solid var(--line);border-radius:8px;padding:11px 12px}

.tt{position:fixed;pointer-events:none;z-index:60;background:var(--surface-1);color:var(--text-primary);
  border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;font-size:12.5px;
  box-shadow:var(--shadow);opacity:0;transition:opacity .1s;max-width:240px}
.tt.on{opacity:1}

/* ---------- timetable ---------- */
.tt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tt-day h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);
  margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tt-slot{border-left:3px solid var(--line-strong);padding:6px 0 6px 9px;margin-bottom:7px;font-size:13px;border-radius:0 5px 5px 0}
.tt-slot .t{color:var(--text-muted);font-size:11.5px}
.tt-slot:hover{background:var(--surface-2)}
.tt-slot.free{border-left-style:dashed}
.tt-study{font-size:11.5px;color:var(--s1);margin-top:3px;line-height:1.4}
.lesson-alert{display:flex;gap:11px;align-items:center;background:var(--surface-1);
  border:1px solid var(--line-strong);border-left:3px solid var(--s1);border-radius:10px;
  padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow);font-size:14px}
.alert-when{color:var(--text-muted);font-size:12.5px;margin-left:8px;font-family:var(--mono)}
.alert-study{font-size:12.5px;color:var(--text-secondary);margin-top:3px}
.today-col{background:color-mix(in srgb,var(--s1) 7%,transparent);border-radius:8px;padding:6px;margin:-6px}

/* ---------- misc ---------- */
.overdue{color:var(--critical);font-weight:550}
.soon{color:var(--serious);font-weight:550}
.done{opacity:.45;text-decoration:line-through}
.linkish{color:var(--s1);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--s1) 35%,transparent)}
.linkish:hover{border-bottom-color:var(--s1)}
.chip{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--text-secondary)}
.uni-card{border:1px solid var(--line);border-radius:10px;padding:15px 16px;background:var(--surface-1)}
.uni-card.dream{border-color:var(--s1);box-shadow:inset 3px 0 0 var(--s1)}
.uni-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);
  margin:12px 0 5px;display:flex;gap:8px;align-items:center}
.uni-list{margin:0;padding-left:18px;font-size:13px;color:var(--text-secondary)}
.uni-list li{margin-bottom:2px}
.uni-p{margin:0 0 4px;font-size:13px;line-height:1.55;color:var(--text-secondary)}
.finding{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);
  font-size:13.5px;line-height:1.55}
.finding:last-child{border-bottom:0}
.hbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hbar span{display:block;height:100%;border-radius:4px}
.block{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0}
.block-min{min-width:46px;font-weight:600;font-size:16px;line-height:1;display:flex;
  flex-direction:column;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.block-min span{font-size:9.5px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.block-why{color:var(--text-muted);font-size:12.5px;margin-top:2px;line-height:1.5}
.issue{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.unifold summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.unifold summary::-webkit-details-marker{display:none}
.unifold summary::before{content:'▸';color:var(--text-muted);font-size:12px}
.unifold[open] summary::before{content:'▾'}
.unifold summary h2{display:inline}
/* --- the route: your university plan as a line with stations --- */
.rline{overflow-x:auto;padding:4px 0 2px;margin:16px 0 6px}
.rline-in{position:relative;height:84px}
.rtrack,.rtrack-fill{position:absolute;left:0;top:11px;height:4px;border-radius:2px}
.rtrack{right:0;background:var(--line)}
.rtrack-fill{background:var(--s1)}
.rstop{position:absolute;top:0;transform:translateX(-50%);background:none;border:0;padding:0 4px;
  color:inherit;font:inherit;text-align:center}
.rstop .rdot{width:14px;height:14px;border-radius:50%;background:var(--surface-1);
  border:4px solid var(--line-strong);margin:4px auto 8px;box-sizing:border-box}
.rstop.past .rdot{border-color:var(--s1);background:var(--s1)}
.rstop.now .rdot{border-color:var(--s1);box-shadow:0 0 0 5px color-mix(in srgb,var(--s1) 18%,transparent)}
.rstop .rname{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.rstop.now .rname{color:var(--s1)}
.rstop .rwhen{display:block;font-size:10.5px;color:var(--text-muted);margin-top:1px}
.rtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rtab{font-size:13px;font-weight:550;padding:6px 13px;border-radius:7px;
  border:1px solid var(--line);background:var(--surface-1);color:var(--text-secondary)}
.rtab[aria-pressed="true"]{background:var(--text-primary);border-color:var(--text-primary);color:var(--bg)}
.rfilter{font-size:11.5px;padding:3px 9px;border-radius:20px;
  border:1px solid var(--line);background:var(--surface-1);color:var(--text-secondary)}
.rfilter[aria-pressed="true"]{background:var(--surface-2);border-color:var(--line-strong);color:var(--text-primary)}
.rphase{display:grid;grid-template-columns:158px 1fr;gap:20px;padding:20px 0;border-top:1px solid var(--line);
  scroll-margin-top:130px}
.rphase:first-child{border-top:0;padding-top:6px}
.rphase.now .rstation{color:var(--s1)}
.rstation{font-size:17px;font-weight:600;line-height:1.2}
.rwhenbig{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.rhere{display:inline-block;font-size:10.5px;font-weight:600;color:var(--bg);background:var(--s1);
  border-radius:4px;padding:2px 7px;margin-top:7px}
.rtask{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--surface-2);
  font-size:13.5px;line-height:1.5;min-width:0}
.rtask:first-child{border-top:0}
.rtask > div{min-width:0}
.rtick{width:18px;height:18px;margin-top:2px;padding:0;border-radius:5px;border:1.5px solid var(--line-strong);
  background:var(--surface-1);color:#fff;font-size:11px;line-height:15px;text-align:center}
.rtick:hover{border-color:var(--s1)}
.rtick:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.rtick[aria-pressed="true"]{background:var(--s1);border-color:var(--s1)}
.rtick[aria-pressed="true"]::after{content:'✓'}
.rt{overflow-wrap:anywhere}
.rtask.ticked .rt{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.rtask.crit .rt::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--critical);margin-right:7px;vertical-align:2px}
.rtask.next .rt{font-weight:600}

<body>
<header class="top">

      <span class="sub" id="termLine"></span>

    </div>
    <div class="tabwrap"><nav class="tabs" role="tablist">
      <button role="tab" data-view="today" aria-selected="true">Today</button>
      <button role="tab" data-view="calendar" aria-selected="false">Calendar</button>
      <button role="tab" data-view="plan" aria-selected="false">Plan</button>

      <button role="tab" data-view="homework" aria-selected="false">Homework</button>
      <button role="tab" data-view="study" aria-selected="false">Study log</button>
      <button role="tab" data-view="papers" aria-selected="false">Papers</button>
      <button role="tab" data-view="analysis" aria-selected="false">Analysis</button>
      <button role="tab" data-view="timetable" aria-selected="false">Timetable</button>

<div class="wrap">
  <div class="lesson-alert" id="lessonAlert" hidden></div>
  <section class="view active" id="view-today"></section>
  <section class="view" id="view-calendar"></section>
  <section class="view" id="view-plan"></section>
  <section class="view" id="view-revision"></section>
  <section class="view" id="view-cards"></section>
  <section class="view" id="view-track"></section>
  <section class="view" id="view-homework"></section>
  <section class="view" id="view-study"></section>
  <section class="view" id="view-papers"></section>
  <section class="view" id="view-analysis"></section>
  <section class="view" id="view-timetable"></section>
  <section class="view" id="view-whiteboard"></section>
  <section class="view" id="view-uni"></section>
  <section class="view" id="view-route"></section>
  <section class="view" id="view-files"></section>
</div>

<div class="tt" id="tooltip"></div>
<div class="savebar" id="savebar">saved</div>

<script>
/* ==================================================================== state */
let S = null;                 // the whole dashboard state
let saveTimer = null;
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* The planning engine is shared with the server — see lib/plan.mjs. The
   server pastes it in here, so this page and /api/app/today never disagree. */
/* @inline lib/plan.mjs */
const PLANNER = createPlanner(() => S);
const { DAY, isoOf, todayISO, parseD, daysBetween, toMins, hhmm, dayKeyOf, addDays,
  subjectById, topicById, CAL, holidayOn, termOn, priorityOf, revisionQueue, gradeFor,
  workloadPlan, predictedFor, projectedPct, igcseBaselineFor, minutesThisWeek, cardsDue, lostMarks, weakSpots, phaseOf,
  studyPlan, weekOf, dayPlan, mergedDay, lessonsOn, isStudySlot, taskScore, openMistakes, mastery,
  studyOptions } = PLANNER;

/* The university route engine, shared with the companion the same way — see
   lib/route.mjs. It only reads S.route, S.routeDone and S.routeOpts. */
/* @inline lib/route.mjs */
const R = createRoute(() => S);

const fmtDay = (iso) => parseD(iso).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
// Milestones span two academic years, so they carry the year too.
const fmtFull = (iso) => parseD(iso).toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });
const uid = () => Math.random().toString(36).slice(2, 10);

const colorOf = (id) => { const s = subjectById(id); return s ? `var(--s${s.slot})` : 'var(--text-muted)'; };
const nameOf  = (id) => id === 'free' ? 'Free period' : !id ? 'General' : (subjectById(id)?.name ?? 'Unknown');
// Tutorial and PE are on the timetable but are not A Level subjects; a slot can
// carry its own title so they show without pretending to be one.
const slotName = (l) => l.title || nameOf(l.subjectId);

/* ------------------------------------------------- school calendar (from
   your school's own 2026-27 PDF: 3 terms, 10 holiday periods) */
const nextBreak = (iso) => CAL().holidays.filter((h) => h.start > iso)
  .sort((a, b) => a.start.localeCompare(b.start))[0] || null;
const schoolWeek = (iso) => { const t = termOn(iso); return t ? Math.floor(daysBetween(t.start, iso) / 7) + 1 : null; };

// A day you're actually in school: inside a term, on a weekday, not a holiday.
function isSchoolDay(iso) {
  if (!termOn(iso) || holidayOn(iso)) return false;
  const wd = parseD(iso).getDay();
  return wd >= 1 && wd <= 5;
}
function schoolDaysLeft(iso) {
  const end = CAL().lastDay; if (!end || iso > end) return 0;
  let n = 0; const d = parseD(iso);
  while (isoOf(d) <= end) { if (isSchoolDay(isoOf(d))) n++; d.setDate(d.getDate() + 1); }
  return n;
}

/* ============================================================ persistence */
/* The companion app on your phone writes to the same state while this page is
   open, so a save can find the server has moved on (409). Then the page fetches
   the newer copy and merges: whatever you changed here since the last save is
   kept, everything else takes the server's version. Records merge by id, so a
   to-do added on the phone and a session logged here both survive.          */
let BASE = null;           // the server's copy as this page last saw it, as JSON

async function load() {
  S = await (await fetch('/api/state')).json();
  BASE = JSON.stringify(S);
}

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const plain = (x) => x && typeof x === 'object' && !Array.isArray(x);
const byId = (xs) => Array.isArray(xs) && xs.every((x) => plain(x) && 'id' in x);

function mergeById(base, mine, theirs) {
  const B = new Map(base.map((x) => [x.id, x])), M = new Map(mine.map((x) => [x.id, x]));
  const T = new Map(theirs.map((x) => [x.id, x]));
  const ids = [...new Set([...theirs.map((x) => x.id), ...mine.map((x) => x.id)])];
  const out = [];
  for (const id of ids) {
    if (!same(M.get(id), B.get(id))) { if (M.has(id)) out.push(M.get(id)); continue; }  // changed or deleted here
    if (T.has(id)) out.push(T.get(id));                                                  // untouched here
  }
  return out;
}

function merge3(base = {}, mine = {}, theirs = {}) {
  const out = {};
  for (const k of new Set([...Object.keys(theirs), ...Object.keys(mine)])) {
    const b = base[k], m = mine[k], t = theirs[k];
    if (k === 'rev' || same(m, b)) out[k] = t;
    else if (same(t, b)) out[k] = m;
    else if (byId(m) && byId(t) && (b === undefined || byId(b))) out[k] = mergeById(b || [], m, t);
    else if (plain(m) && plain(t)) out[k] = merge3(plain(b) ? b : {}, m, t);
    else out[k] = m;                                    // both changed one value: yours wins
  }
  return out;
}

function flashSave(text, ms = 1100) {
  const bar = $('#savebar');
  bar.textContent = text; bar.classList.add('on');
  setTimeout(() => bar.classList.remove('on'), ms);
}

async function pullRemote() {
  const fresh = await (await fetch('/api/state')).json();
  S = merge3(JSON.parse(BASE || '{}'), S, fresh);
  BASE = JSON.stringify(fresh);
  return fresh;
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saveTimer = null;
    try {
      const body = JSON.stringify(S);
      const r = await fetch('/api/state', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body,
      });
      if (r.status === 409) {                           // the phone saved first
        await pullRemote();
        renderAll();
        return save();
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const { rev } = await r.json();
      S.rev = rev;
      BASE = JSON.stringify({ ...JSON.parse(body), rev });
      flashSave('saved');
    } catch (e) {
      flashSave('could not save — ' + (e.message || 'offline'), 2600);
    }
  }, 400);
}

// Pick up what the companion app changed while this page sat open: check the
// revision now and then, and whenever the tab comes back into view. Never while
// you are typing, and never with a save of your own still pending.
async function checkRemote() {
  if (document.hidden || saveTimer || document.activeElement?.matches('input, select, textarea')) return;
  try {
    const { rev } = await (await fetch('/api/state/rev')).json();
    if (rev === S.rev) return;
    await pullRemote();
    renderAll();
  } catch { /* offline — try again next time */ }
}
setInterval(checkRemote, 45000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkRemote(); });

function mutate(fn) { fn(); save(); renderAll(); }

/* ================================================== grades & projection */
const gradeRank = (g) => ['U','E','D','C','B','A','A*'].indexOf(g);
const EXAM_START = () => S.profile.examStart || '2028-05-15';
const weeksToExams = () => Math.max(0, daysBetween(todayISO(), EXAM_START()) / 7);

const art = (g) => (/^A/.test(g) ? 'an ' : 'a ') + g;   // "an A*", "a B"

// Headline IGCSE statistics. The overall mean flatters an engineering
// applicant, because languages pull it up and the sciences are what count.
function igcseStats() {
  const rows = S.igcse || [];
  if (!rows.length) return null;
  const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length;
  const sci = ['Mathematics A (Higher)', 'Physics', 'Chemistry', 'Biology'];
  const lang = ['German', 'English Literature', 'English (Second Lang.)', 'Spanish'];
  const g = (list) => rows.filter((r) => list.includes(r.subject)).map((r) => r.grade);
  return {
    rows,
    all: mean(rows.map((r) => r.grade)),
    stem: g(sci).length ? mean(g(sci)) : null,
    lang: g(lang).length ? mean(g(lang)) : null,
    best: Math.max(...rows.map((r) => r.grade)),
    worst: Math.min(...rows.map((r) => r.grade)),
  };
}

function igcseSummary() {
  const st = igcseStats();
  if (!st) return 'No IGCSE results recorded.';
  return 'IGCSE results (Pearson, June 2026): '
    + st.rows.map((r) => `${r.subject} ${r.grade}${r.pct ? ` (${r.pct}%)` : ''}`).join(', ')
    + `. Mean ${st.all.toFixed(2)} overall, ${st.stem?.toFixed(2)} across maths and sciences, `
    + `${st.lang?.toFixed(2)} across languages.`;
}

/* A live prediction against a grade a university asks for: how many grades
   short, or null when there is nothing to predict from yet. */
function gradeGap(subjectId, want) {
  const p = subjectById(subjectId) ? predictedFor(subjectId) : null;
  const g = p == null ? null : gradeFor(p);
  return { g, gap: g == null ? null : Math.max(0, gradeRank(want) - gradeRank(g)) };
}
const gradeGapHtml = ({ g, gap }) => g == null
  ? '<span class="status" style="color:var(--text-muted)">no prediction yet</span>'
  : !gap ? `<span class="status good">✓ predicted ${esc(g)}</span>`
  : `<span class="status ${gap === 1 ? 'warn' : 'bad'}">predicted ${esc(g)} · ${gap} grade${gap === 1 ? '' : 's'} short</span>`;

function trackStatus(subjectId) {
  const pct = predictedFor(subjectId);
  const subj = subjectById(subjectId);
  if (pct == null) return { pct: null, grade: null, target: subj.target, state: 'nodata' };
  const grade = gradeFor(pct);
  if (subj.locked) return { pct, grade: subj.target, target: subj.target, state: 'locked' };
  const diff = gradeRank(grade) - gradeRank(subj.target);
  return { pct, grade, target: subj.target,
    state: diff >= 0 ? 'good' : diff === -1 ? 'warn' : 'bad' };
}

/* ============================================================ study stats */
function streakDays() {
  const days = new Set(S.sessions.map((s) => s.date));
  let n = 0; const d = new Date();
  // today not being logged yet shouldn't break a streak — start from yesterday
  if (!days.has(isoOf(d))) d.setDate(d.getDate() - 1);
  while (days.has(isoOf(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ============================================================ chart tools */
const tip = $('#tooltip');
function showTip(e, html) {
  tip.innerHTML = html; tip.classList.add('on');
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const r = tip.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.classList.remove('on');
document.addEventListener('mouseleave', hideTip);

// Horizontal bars: magnitude by subject, always direct-labelled (the light-mode
// palette needs visible labels, not colour alone, to carry identity).
function barChart(rows, { max = null, unit = '' } = {}) {
  if (!rows.length) return '<div class="empty">Nothing logged yet.</div>';
  const hi = max ?? Math.max(...rows.map((r) => Math.max(r.value, r.target || 0)), 1);
  const W = 600, H = 40, BAR = 400;   // user units ≈ px at typical card width
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${rows.length * H}"
            role="img" aria-label="Study time by subject">${rows.map((r, i) => {
    const y = i * H;
    const w = Math.max(2, (r.value / hi) * BAR);
    const tw = r.target ? (r.target / hi) * BAR : null;
    return `
      <text x="0" y="${y + 15}" class="bar-label">${esc(r.label)}</text>
      <text x="${W}" y="${y + 15}" text-anchor="end" class="bar-label"
            style="fill:var(--text-secondary)">${r.display ?? r.value}${unit}</text>
      <rect x="0" y="${y + 21}" width="${BAR}" height="9" rx="4" fill="var(--surface-2)"></rect>
      <rect x="0" y="${y + 21}" width="${w.toFixed(1)}" height="9" rx="4" fill="${r.color}"
            data-tip="${esc(r.label)}: ${esc(String(r.display ?? r.value))}${unit}${r.target ? ' · target ' + r.target + ' h' : ''}"></rect>
      ${tw != null ? `<line x1="${tw.toFixed(1)}" y1="${y + 17}" x2="${tw.toFixed(1)}" y2="${y + 34}"
            stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="3 2"></line>` : ''}`;
  }).join('')}</svg>`;
}

// One small multiple per subject — a single series per panel, so identity never
// rests on telling two colours apart.
function sparkline(points, color, { w = 220, h = 46 } = {}) {
  if (points.length === 0) return '';
  if (points.length === 1) {
    return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}"><circle cx="${w/2}" cy="${h/2}" r="3.5" fill="${color}"/></svg>`;
  }
  const xs = points.map((p) => parseD(p.date).getTime());
  const lo = Math.min(...xs), hi = Math.max(...xs), span = hi - lo || 1;
  const pad = 6;
  const X = (t) => pad + ((t - lo) / span) * (w - pad * 2);
  const Y = (v) => h - pad - (Math.max(0, Math.min(100, v)) / 100) * (h - pad * 2);
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(parseD(p.date).getTime()).toFixed(1)},${Y(p.pct).toFixed(1)}`).join(' ');
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img">
    <line x1="${pad}" y1="${Y(S.settings.boundaries.A)}" x2="${w-pad}" y2="${Y(S.settings.boundaries.A)}"
          class="grid-line" stroke-dasharray="2 3"></line>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>

// The academic year as one band: term time solid, breaks cut out, today marked.
function yearStrip() {
  const c = CAL(); if (!c.terms.length) return '';
  const from = c.terms[0].start, to = c.holidays.at(-1)?.end || c.lastDay;
  const span = daysBetween(from, to) || 1;
  const W = 900, TOP = 16, BAR = 22;      // labels sit below the bar, never on it
  const X = (iso) => (daysBetween(from, iso) / span) * W;
  const today = todayISO();
  const inRange = today >= from && today <= to;

  return `<svg class="chart-svg" viewBox="0 0 ${W} 62" role="img"
            aria-label="Academic year timeline with terms and holidays">
    ${c.terms.map((t) => `<rect x="${X(t.start).toFixed(1)}" y="${TOP}" rx="4"
        width="${Math.max(2, X(t.end) - X(t.start)).toFixed(1)}" height="${BAR}"
        fill="var(--s1)"
        data-tip="${esc(t.name)}<br>${esc(fmtDay(t.start))} – ${esc(fmtDay(t.end))}"></rect>`).join('')}
    ${c.holidays.map((h) => `<rect x="${X(h.start).toFixed(1)}" y="${TOP}" rx="2"
        width="${Math.max(1.5, X(h.end) - X(h.start) + 1.5).toFixed(1)}" height="${BAR}"
        fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="0.5"
        data-tip="${esc(h.label)}<br>${esc(fmtDay(h.start))}${h.start !== h.end ? ' – ' + esc(fmtDay(h.end)) : ''}"></rect>`).join('')}
    ${c.terms.map((t) => `<text x="${((X(t.start) + X(t.end)) / 2).toFixed(1)}" y="${TOP + BAR + 14}"
        text-anchor="middle" style="fill:var(--text-secondary);font-size:11.5px;font-weight:550"
        >${esc(t.name)}</text>`).join('')}
    ${inRange ? `<line x1="${X(today).toFixed(1)}" y1="${TOP - 6}" x2="${X(today).toFixed(1)}" y2="${TOP + BAR + 4}"
        stroke="var(--critical)" stroke-width="2"></line>
      <text x="${X(today).toFixed(1)}" y="${TOP - 9}" text-anchor="middle"
        style="fill:var(--critical);font-size:11px;font-weight:600">today</text>` : ''}
  </svg>`;
}

/* ========================================================== flashcards
   Leitner boxes: a card you get right moves up and comes back later; a card you
   miss drops to box 1 and comes back tomorrow. Independent of the topic queue —
   topics schedule study sessions, cards schedule recall. */
const BOX_DAYS = [1, 3, 7, 16, 35];

function gradeCard(id, got) {
  mutate(() => {
    const c = (S.cards || []).find((x) => x.id === id);
    if (!c) return;
    c.box = got ? Math.min(5, (c.box || 1) + 1) : 1;
    if (!got) c.lapses = (c.lapses || 0) + 1;
    c.reviewed = todayISO();
    const d = parseD(todayISO());
    d.setDate(d.getDate() + BOX_DAYS[c.box - 1]);
    c.due = isoOf(d);
  });
}

/* ======================================================== lesson alerts
   A quiet banner before each lesson: what it is, where it is, and — for a free
   period — what to study. Adjacent slots of the same subject are merged, so a
   double lesson alerts once, not twice. Never makes a sound. */
const FREE = 'free';
let alertTimer = null, lastAlertId = null, dismissedId = null;

// What to do with a free period: what you picked for it in the companion app,
// else the top of the same options the app offers (lib/plan.mjs studyOptions).
function studyFor(slot) {
  const mins = slot.start && slot.end ? toMins(slot.end) - toMins(slot.start) : 50;
  const sp = studyOptions(todayISO()).find((x) => x.key === (slot.start || slot.period));
  const o = sp?.chosen || sp?.options?.[0];
  if (o) return { text: o.title + (o.subjectId ? ` — ${nameOf(o.subjectId)}` : ''),
    why: sp.chosen ? 'your pick for this period' : o.why, mins };
  return { text: 'Nothing queued', why: 'mark some topics as taught', mins };
}

function upcomingSlot(now = new Date()) {
  if (holidayOn(todayISO()) || !termOn(todayISO())) return null;
  const nowM = toMins(hhmm(now));
  for (const sl of mergedDay(dayKeyOf(now))) {
    const start = toMins(sl.start);
    if (start >= nowM && start - nowM <= 10) return { ...sl, inMins: start - nowM };
  }
  return null;
}

function renderAlert() {
  const host = $('#lessonAlert'); if (!host) return;
  const sl = upcomingSlot();
  if (!sl) { host.hidden = true; return; }

  const id = todayISO() + '|' + sl.start + '|' + sl.subjectId;
  if (dismissedId === id) { host.hidden = true; return; }

  const free = sl.subjectId === FREE;
  const study = isStudySlot(sl) ? studyFor(sl) : null;
  host.hidden = false;
  host.innerHTML = `
    <span class="dot" style="background:${free ? 'var(--text-muted)' : colorOf(sl.subjectId)}"></span>
    <div style="flex:1">
      <b>${esc(slotName(sl))}</b>
      <span class="alert-when">in ${sl.inMins === 0 ? 'now' : sl.inMins + ' min'}${
        sl.double ? ' · double' : ''}${sl.room && !free ? ' · ' + esc(sl.room) : ''}</span>
      ${study ? `<div class="alert-study">Study: <b>${esc(study.text)}</b> — ${esc(study.why)}</div>` : ''}
    </div>
    <button class="btn ghost sm" id="alertDismiss">Dismiss</button>`;

  // Silent OS notification, once per slot, only where the browser allows it.
  if (lastAlertId !== id) {
    lastAlertId = id;
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        new Notification(free ? 'Free period' : nameOf(sl.subjectId), {
          body: (free && study ? 'Study: ' + study.text
                : (sl.room ? 'Room ' + sl.room + ' · ' : '') + 'starts in ' + sl.inMins + ' min'),
          tag: id, silent: true, requireInteraction: false,
        });
      }
    } catch { /* blocked in this context — the banner already covers it */ }
  }
}

function startAlerts() {
  clearInterval(alertTimer);
  renderAlert();
  alertTimer = setInterval(renderAlert, 60000);
}

async function askNotifications(btn) {
  if (typeof Notification === 'undefined') {
    btn.textContent = 'Not available here'; return;
  }
  try {
    const r = await Notification.requestPermission();
    btn.textContent = r === 'granted' ? 'Notifications on' : 'Banner only';
    btn.disabled = r === 'granted';
  } catch { btn.textContent = 'Banner only'; }
}

// First school day on or after a date — used for "back on ..." after a holiday.
function nextSchoolDay(iso) {
  const d = parseD(iso);
  for (let i = 0; i < 400; i++) {
    d.setDate(d.getDate() + 1);
    if (isSchoolDay(isoOf(d))) return isoOf(d);
  }
  return iso;
}

function qrow(t, p) {
  const since = t.lastStudied ? daysBetween(t.lastStudied, todayISO()) : null;
  return `
  <div class="qrow">
    <div class="qbar" style="background:${colorOf(t.subjectId)}"></div>
    <div style="padding-left:2px">
      <div class="qname">${esc(t.name)}</div>
      <div class="qmeta">${esc(nameOf(t.subjectId))} · ${esc(t.unit)} ·
        ${since === null ? 'never revised' : since === 0 ? 'revised today' : since + 'd ago'}
        · priority ${p.toFixed(1)}</div>
    </div>
    <div class="conf" title="Rate it after you revise — this also marks it revised today">
      ${[0,1,2,3,4,5].map((n) => `<button class="${t.confidence === n ? 'on' : ''}"
          data-rate="${t.id}" data-conf="${n}" title="${n}/5 confident">${n}</button>`).join('')}
    </div>

}

/* A timetable typed from a printed sheet is easy to get subtly wrong. Every
   A Level subject should appear the same number of times each week, so state
   the expectation and let the page check it. */
function timetableCheck() {
  // The invariant is per FORTNIGHT, not per week: Further Maths runs 4 in week A
  // and 6 in week B, so a per-week rule flags a correct timetable as broken.
  const want = S.settings.periodsPerFortnight || 10;
  const out = [];
  for (const s of S.subjects.filter((x) => x.active && !x.locked)) {
    const per = { A: 0, B: 0 };
    for (const wk of ['A', 'B']) {
      per[wk] = ['mon','tue','wed','thu','fri']
        .reduce((a, d) => a + (S.timetable[wk]?.[d] || []).filter((l) => l.subjectId === s.id).length, 0);
    }
    const n = per.A + per.B;
    if (n !== want) out.push({ subject: s, have: n, want, per });
  }
  return out;
}

/* ============================================================== calendar
   Everything dated, on one grid: holidays and term boundaries from the school
   calendar, homework due dates, papers you sat, and the fixed ETH milestones. */
let calMonth = null;                      // {y, m} — null means "this month"

const monthOf = () => calMonth || { y: new Date().getFullYear(), m: new Date().getMonth() };

function shiftMonth(by) {
  const { y, m } = monthOf();
  const d = new Date(y, m + by, 1);
  calMonth = { y: d.getFullYear(), m: d.getMonth() };
  renderAll();
}

// Everything that lands on a given day, in the order it should be read.
function eventsOn(iso) {
  const out = [];
  const hol = holidayOn(iso);
  if (hol) out.push({ kind: 'holiday', label: hol.label });
  for (const t of (S.calendar?.terms || [])) {
    if (t.start === iso) out.push({ kind: 'term', label: t.name + ' starts' });
    if (t.end === iso) out.push({ kind: 'term', label: t.name + ' ends' });
  }
  for (const m of (S.milestones || [])) {
    if (m.date === iso) out.push({ kind: 'milestone', label: m.label, note: m.note });
  }
  for (const h of S.homework) {
    if (h.due === iso) out.push({ kind: h.done ? 'done' : 'due', label: h.title, subjectId: h.subjectId });
  }
  for (const p of S.papers) {
    if (p.date === iso) out.push({ kind: 'paper', subjectId: p.subjectId,
      label: `${p.name} — ${Math.round(p.mark / p.total * 100)}%` });
  }
  // tests added in the companion app; once a result is logged they are papers
  for (const t of (S.tests || [])) {
    if (t.date === iso && t.result == null) out.push({ kind: 'milestone', subjectId: t.subjectId, label: t.title, note: 'test' });
  }
  // your route's deadlines, minus the UK/MIT ones once you drop those
  for (const d of R.deadlines(iso, 99)) {
    if (d.date === iso) out.push({ kind: 'route', label: (d.approx ? '≈ ' : '') + d.label,
      note: d.approx ? 'route deadline, approximate date' : 'route deadline' });
  }
  return out;
}

views.calendar = () => {

  const days = new Date(y, m + 1, 0).getDate();
  const title = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(isoOf(new Date(y, m, d)));
  while (cells.length % 7) cells.push(null);

  // what is coming up, regardless of which month you are looking at
  const soon = [];
  for (let i = 0; i < 45 && soon.length < 8; i++) {
    const d = parseD(today); d.setDate(d.getDate() + i);
    const iso = isoOf(d);
    for (const e of eventsOn(iso)) if (e.kind !== 'holiday' || i === 0) soon.push({ iso, ...e });

  return `

        const ev = eventsOn(iso);

        const wknd = [5, 6].includes((parseD(iso).getDay() + 6) % 7);
        const cls = [ 'cal-d', iso === today ? 'today' : '', hol ? 'hol' : '', wknd ? 'wknd' : '',

        return `<div class="${cls}">

                ? `<span class="dot" style="background:${colorOf(e.subjectId)}"></span>` : ''}${esc(e.label)}</div>`).join('')}
          ${ev.length > 3 ? `<div class="cal-more">+${ev.length - 3} more</div>` : ''}
        </div>`;
      }).join('')}
    </div>

    <div class="row" style="gap:14px;margin-top:14px;font-size:11.5px;color:var(--text-muted)">
      <span class="row" style="gap:6px"><span class="key hol"></span>holiday</span>

  const papers = S.papers.slice().sort((a, b) => b.date.localeCompare(a.date));

  return `
  <div class="card" style="margin-bottom:16px">
    <h2>Where the marks actually go</h2>

      the difference between knowing you're at 68% and knowing what to do on Monday.</div>
    ${total ? `
      <div class="grid g2" style="margin-top:16px">
        <div>
          <div class="uni-label">Biggest issues by topic</div>
          ${weak.map((w) => `
            <div class="issue">
              <span class="dot" style="background:${colorOf(w.subjectId)}"></span>

        <div>
          <div class="uni-label">And why you lost them</div>
          ${Object.entries(ERROR_TYPES).map(([k, v]) => {

            return `<div class="issue">
              <div style="flex:1">
                <div class="row" style="justify-content:space-between">

// Work marked by Claude in the companion app. Its lost marks already count in
// the two panels above; this lists the pieces themselves.
function markedWorkCard() {
  const list = (S.attempts || []).slice().sort((a, b) => (b.created || b.date).localeCompare(a.created || a.date));
  const sheets = S.worksheets || [], notes = (S.attachments || []).filter((a) => a.kind === 'notes');
  if (!list.length && !sheets.length && !notes.length) return '';
  const open = openMistakes().length;
  const answered = new Set(list.map((a) => a.worksheetId).filter(Boolean));
  const toDo = sheets.filter((w) => !answered.has(w.id)).length;
  const sheetOf = (id) => sheets.find((w) => w.id === id);
  return `<div class="card" style="margin-bottom:16px">
    <h2>Marked work — ${list.length}</h2>
    <div class="hint">Uploaded and marked in the companion app. ${open ? `<b>${open}</b> mistake${open === 1 ? '' : 's'} still to fix — open History in the app.` : list.length ? 'Every mistake is fixed.' : ''}
      ${sheets.length ? `<br>${sheets.length} worksheet${sheets.length === 1 ? '' : 's'}${toDo ? `, <b>${toDo}</b> still to answer` : ', all answered'}.` : ''}
      ${notes.length ? `${sheets.length ? ' ' : '<br>'}${notes.length} set${notes.length === 1 ? '' : 's'} of notes.` : ''}</div>
    <table><tbody>${list.slice(0, 15).map((a) => {
      const lost = a.questions.filter((q) => q.marksLost > 0);
      const topics = [...new Set(lost.map((q) => q.topicId).filter(Boolean))].map((id) => topicById(id)?.name).filter(Boolean);
      return `<tr>
        <td style="white-space:nowrap">${esc(fmtDay(a.date))}</td>
        <td><span class="row" style="gap:8px"><span class="dot" style="background:${colorOf(a.subjectId)}"></span>${esc(a.title)}${
          sheetOf(a.worksheetId) ? ` <span style="font-size:12px;color:var(--text-muted)">· worksheet “${esc(sheetOf(a.worksheetId).title)}”</span>` : ''}</span>
          ${topics.length ? `<div style="font-size:12px;color:var(--text-muted);margin-left:17px">lost marks in ${esc(topics.join(', '))}</div>` : ''}</td>
        <td class="num">${a.score}/${a.max}</td>
        <td>${a.driveUrl ? `<a href="${esc(a.driveUrl)}" target="_blank" rel="noopener">Drive</a>` : ''}</td>
      </tr>`;
    }).join('')}</tbody></table>
  </div>`;
}

  });
  const short = rows.filter((r) => r.gap !== null && r.gap < 0)
    .sort((a, b) => a.gap - b.gap || (a.s.weeklyHours < b.s.weeklyHours ? 1 : -1));
  const over = rows.filter((r) => r.gap !== null && r.gap > 0);

  const today = todayISO();

      <div class="${short.length ? 'exam-box' : 'spare'}" style="margin-top:12px">

      ${over.map(({ s, pred }) => `
        <div class="finding">
          <span class="dot" style="background:${colorOf(s.id)};margin-top:6px"></span>
          <div><b>${esc(s.name)}</b> — you're predicted ${gradeFor(pred)} but only targeting ${esc(s.target)}.
          Raise the target on the On track tab, or the dashboard will keep telling you you're fine.</div>
        </div>`).join('')}` : ''}
    ${!short.length && !over.length ? '<div class="empty">Every subject is sitting on its target.</div>' : ''}
  </div>

  <div class="card" style="margin-top:16px">
    <h2>How much work that actually is</h2>
    <div class="hint">Your ${S.settings.weeklyTargetHours} h weekly target, split by how far each subject
      sits below its goal. Every subject keeps a maintenance share; the rest follows the gap.</div>
    ${(() => {
      const plan = workloadPlan();
      const wk = weeksToExams();
      const logged = Object.fromEntries(S.subjects.map((s) => [s.id, minutesThisWeek(s.id) / 60]));
      const max = Math.max(...plan.map((p) => p.hours), 1);
      return `
      <div class="grid g3" style="margin:14px 0 18px">
        <div class="stat"><div class="label">Weeks to exams</div>
          <div class="value">${wk.toFixed(0)}</div>
          <div class="foot">${esc(fmtDay(EXAM_START()))} · ${(wk / 4.35).toFixed(0)} months</div></div>
        <div class="stat"><div class="label">Study hours left</div>
          <div class="value">${Math.round(wk * S.settings.weeklyTargetHours).toLocaleString()}</div>
          <div class="foot">at ${S.settings.weeklyTargetHours} h/week, every week</div></div>
        <div class="stat"><div class="label">Logged this week</div>
          <div class="value">${(minutesThisWeek() / 60).toFixed(1)}<span style="font-size:15px;color:var(--text-muted)"> h</span></div>
          <div class="foot">of ${S.settings.weeklyTargetHours} h planned</div></div>
      </div>
      <table>
        <thead><tr><th>Subject</th><th>Predicted</th><th>Target</th><th>Hours/week</th><th style="width:34%">Share</th><th>Logged</th></tr></thead>
        <tbody>${plan.map((p) => `
          <tr>
            <td><span class="row" style="gap:8px"><span class="dot" style="background:${colorOf(p.s.id)}"></span>${esc(p.s.name)}</span></td>
            <td class="num">${p.pred == null ? '—' : gradeFor(p.pred)}</td>
            <td class="num">${esc(p.s.target)}</td>
            <td class="num"><b>${p.hours.toFixed(1)} h</b></td>
            <td><div class="hbar"><span style="width:${(p.hours / max * 100).toFixed(1)}%;background:${colorOf(p.s.id)}"></span></div></td>
            <td class="num" style="color:var(--text-muted)">${logged[p.s.id].toFixed(1)} h</td>
          </tr>`).join('')}</tbody>
      </table>
      <div class="hint" style="margin-top:14px">
        Over ${wk.toFixed(0)} weeks that is
        ${plan.map((p) => `<b>${Math.round(p.hours * wk).toLocaleString()} h</b> on ${esc(p.s.name)}`)
          .join(', ').replace(/,([^,]*)$/, ' and$1')}.
      </div>`;
    })()}
  </div>

  ${ms.length ? `<div class="card" style="margin-bottom:16px">
    <h2>Fixed dates</h2>
    <div class="hint">These do not move for you. The entrance-exam dates matter only if you need the
      fallback — it sits four months before your A Levels, on a different syllabus.</div>
    <div class="timeline">
      ${ms.map((m) => `
        <div class="ms${m.away < 0 ? ' past' : ''}">
          <div class="ms-when">
            <b>${esc(fmtFull(m.date))}</b>
            <span>${m.away < 0 ? 'passed' : m.away < 400 ? 'in ' + Math.round(m.away / 7) + ' weeks' : 'in ' + (m.away / 365).toFixed(1) + ' years'}</span>
          </div>
          <div><b>${esc(m.label)}</b><div class="ms-note">${esc(m.note)}</div></div>
        </div>`).join('')}
    </div>
  </div>` : ''}

  <details class="card unifold" style="margin-bottom:16px"><summary><h2>Where you're aiming</h2></summary>
    <div class="hint">Requirements checked against the official pages in September 2026. They change —
      each card links to its source, and you should re-check before you apply.</div>
    <div class="grid g2" style="margin-top:14px">
      ${(S.unis || []).map((u) => `
        <div class="uni-card${u.status === 'dream' ? ' dream' : ''}">
          <div class="row" style="justify-content:space-between;align-items:baseline">
            <h3 style="font-size:15px">${esc(u.name)}</h3>
            <span class="chip">${u.status === 'dream' ? 'first choice' : 'backup'}</span>
          </div>
          <div style="color:var(--text-muted);font-size:12.5px;margin-bottom:10px">${esc(u.city)}</div>
          <div class="uni-label">Courses</div>
          <ul class="uni-list">${u.programmes.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
          <div class="uni-label">${esc(u.language.lang)} ${esc(u.language.level)}
            <span class="status ${u.language.met ? 'good' : 'warn'}">${u.language.met ? '✓ covered' : '! to do'}</span></div>
          <p class="uni-p">${esc(u.language.note)}</p>
          <div class="uni-label">Getting in</div>
          <p class="uni-p">${esc(u.entry)}</p>
          ${u.requirements ? `<ul class="uni-list" style="margin-top:6px">${u.requirements.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
          ${u.exam ? `
            <div class="uni-label">Entrance examination</div>
            <div class="exam-box">
              <p class="uni-p"><b>${esc(u.exam.warning)}</b></p>
              <p class="uni-p">${esc(u.exam.when)}</p>
              <p class="uni-p">${esc(u.exam.syllabus)}</p>
              <p class="uni-p" style="color:var(--text-muted)">Register ${esc(u.exam.register)} · ${esc(u.exam.fee)}<br>${esc(u.exam.format)}</p>
            </div>` : ''}
          ${u.dataNote ? `<p class="uni-p" style="color:var(--serious)">${esc(u.dataNote)}</p>` : ''}
          <a class="linkish" style="font-size:12.5px" href="${esc(u.link)}" target="_blank" rel="noopener">Official requirements →</a>
        </div>`).join('')}
    </div>
  </details>`;

};

/* ================================================================== route
   Your university plan (S.route — imported in Files, never part of this code)
   through lib/route.mjs: where you are, whether you are on track, and what to
   do today. Every string from the plan goes through esc(); links only if https. */
let routeTab = 'timeline', routeTag = '', routePending = null;
const TAG_NAMES = { eth: 'ETH', de: 'Germany', uk: 'UK', mit: 'MIT', grades: 'grades', port: 'portfolio',
  skill: 'skills', earn: 'earning', uni: 'uni' };
const rLink = (url, html) => (/^https:\/\//i.test(url || '')
  ? `<a class="linkish" href="${esc(url)}" target="_blank" rel="noopener">${html}</a>` : '');
const rTags = (tags) => tags.map((t) => `<span class="rtag">${esc(TAG_NAMES[t] || t)}</span>`).join('');

function routeTick(id) {
  mutate(() => { S.routeDone ||= {}; if (S.routeDone[id]) delete S.routeDone[id]; else S.routeDone[id] = todayISO(); });
}

// One tickable line. `html` and `meta` are markup the caller built with esc().
function routeRow(id, html, meta = '', { crit = false, cls = '' } = {}) {
  const done = R.isDone(id);
  return `<div class="rtask${done ? ' ticked' : ''}${crit ? ' crit' : ''}${cls}">
    ${id ? `<button class="rtick" data-rtick="${esc(id)}" aria-pressed="${done}"
      title="${done ? 'Done — tap to untick' : 'Tick when done'}"></button>` : '<span></span>'}
    <div><span class="rt">${html}</span>${meta}</div>
  </div>`;
}

// A line of today's checklist (lib/route.mjs checklist().items).
function routeTodayRow(x) {
  const who = x.projectName || x.trackName, link = rLink(x.url, 'open ↗');
  return routeRow(x.id, esc(x.text), `<span class="rtags"><span class="rtag">${x.minutes} min</span>
      <span class="rtag${x.overdue ? ' bad' : ''}">${esc(x.reason)}</span></span>
    ${who || link ? `<span class="rnote">${esc(who || '')}${who && link ? ' · ' : ''}${link}</span>` : ''}`,
    { crit: x.critical });
}

function routeVerdict(st) {
  if (!st.total) return ['', 'Nothing to tick in this stage'];
  const tail = `${st.done} of ${st.total} done, ${st.timePct}% of the stage gone`;
  return {
    ahead: ['good', `Ahead: ${tail}`],
    'on-track': ['good', `On track: ${tail}`],
    behind: ['bad', `Behind by ${st.behindBy} item${st.behindBy === 1 ? '' : 's'}: ${tail}`],
  }[st.verdict] || ['', "Tick what you've done to see if you're on track"];
}

const routeMode = (c) => (c.mode === 'exam' ? `Exam week (${c.examLabel}): grades only`
  : `${{ school: 'School day', weekend: 'Weekend', holiday: 'Holiday' }[c.mode]} · up to ${c.budget} min`);

// The Today tab's short version.
// Daily in the last week: unfixed mistakes are archived 14 days after the work.
function archiveReminderCard() {
  const soon = openMistakes().filter((m) => m.daysLeft <= 7);
  if (!soon.length) return '';
  const first = Math.max(0, Math.min(...soon.map((m) => m.daysLeft)));
  const works = [...new Set(soon.map((m) => m.title))];
  return `<div class="card" style="margin-top:16px">
    <h2>Fix before they're archived</h2>
    <div class="hint"><span class="status ${first <= 3 ? 'bad' : 'warn'}">${soon.length} mistake${soon.length === 1 ? '' : 's'} · first archived ${first === 0 ? 'tonight' : `in ${first} day${first === 1 ? '' : 's'}`}</span>
      · fix them in the companion app (History → Mistakes). Archived ones stay as data, with no credit.</div>
    ${works.slice(0, 5).map((t) => `<div class="rnote">${esc(t)}</div>`).join('')}${works.length > 5 ? `<div class="rnote">+${works.length - 5} more</div>` : ''}
  </div>`;
}

function routeTodayCard() {
  if (!R.plan()) return '';
  const today = todayISO(), c = R.checklist(today), st = R.progress(today).stage;
  const [cls, text] = routeVerdict(st);
  return `<div class="card" style="margin-top:16px">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h2>Route today · ${esc(st.station)}</h2>
      <button class="btn sm" data-view="route">Open the route →</button>
    </div>
    <div class="hint"><span class="status ${cls}">${esc(text)}</span> · ${esc(routeMode(c))}</div>
    ${c.items.slice(0, 3).map(routeTodayRow).join('') || '<div class="empty" style="padding:10px 4px">Nothing open for today.</div>'}
    ${c.items.length > 3 ? `<div class="rnote">+${c.items.length - 3} more on the Route tab</div>` : ''}
  </div>`;
}

views.route = () => {
  const P = R.plan();
  if (!P) return `<div class="card">
    <h2>Your route</h2>
    <p class="uni-p" style="margin:10px 0 14px">No university plan yet. Once you import one, this tab turns it into
      today's short list and an honest answer to "am I on track?" — stages, tasks, courses, portfolio projects,
      earning and every university's requirements, each with a box to tick. Your plan lives in your data, never in the app.</p>
    <button class="btn primary" data-view="files">Import your plan in Files</button>
  </div>`;

  const today = todayISO(), pr = R.progress(today), c = R.checklist(today), o = R.opts();
  const st = pr.stage, si = st.index, n = P.phases.length;
  const [vcls, vtext] = routeVerdict(st);
  const dl = R.deadlines(today, 3);
  const doneToday = R.items().filter((it) => S.routeDone?.[it.id] === today && !c.items.some((x) => x.id === it.id));
  const TABS = [['timeline', 'Timeline'], ['reqs', 'Requirements'], ['portfolio', 'Portfolio'], ['courses', 'Courses'], ['earn', 'Earning']];
  const body = { timeline: routeTimeline, reqs: routeReqs, portfolio: routePortfolio, courses: routeCourses, earn: routeEarn };

  return `
  <div class="card" style="margin-bottom:16px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div style="flex:1;min-width:220px">
        <h2>${esc(P.name || 'Your route')}</h2>
        <div class="hint" style="margin:0">${esc(P.story || 'Your university plan, stage by stage.')}</div>
      </div>
      <div class="row" style="gap:14px;font-size:13px;color:var(--text-secondary)">
        <label class="row" style="gap:6px"><input type="checkbox" data-ropt="uk" ${o.uk ? 'checked' : ''}>Keep UK applications</label>
        <label class="row" style="gap:6px"><input type="checkbox" data-ropt="mit" ${o.mit ? 'checked' : ''}>Keep MIT</label>
      </div>
    </div>
    ${P._example ? `<div class="exam-box" style="margin-top:12px"><p class="uni-p"><b>This is an example plan</b> —
      import yours in <button class="btn ghost sm" data-view="files" style="padding:0 4px;color:var(--s1)">Files</button></p></div>` : ''}
    <div class="rline"><div class="rline-in" style="min-width:${n * 96}px">
      <div class="rtrack"></div>
      <div class="rtrack-fill" style="width:${((si + st.timePct / 100) / n * 100).toFixed(1)}%"></div>
      ${P.phases.map((ph, i) => `<button class="rstop ${i < si ? 'past' : i === si ? 'now' : ''}" data-rstop="${esc(ph.id)}"
          style="left:${((i + 0.5) / n * 100).toFixed(2)}%;width:${(100 / n).toFixed(2)}%" title="Show this stage">
        <span class="rdot"></span><span class="rname">${esc(ph.station)}</span><span class="rwhen">${esc(ph.when || '')}</span>
      </button>`).join('')}
    </div></div>
    <div class="grid g2">
      <div>
        <div class="uni-label" style="margin-top:0">Now · ${esc(st.station)}${st.when ? ' · ' + esc(st.when) : ''}</div>
        ${st.why ? `<p class="uni-p">${esc(st.why)}</p>` : ''}
        <div class="status ${vcls}" style="margin-top:8px">${esc(vtext)}</div>
        <div class="uni-label">Whole plan · ${pr.plan.pct}%</div>
        <div class="hbar"><span style="width:${pr.plan.pct}%;background:var(--s1)"></span></div>
        <div class="rnote">${pr.plan.done} of ${pr.plan.total} done</div>
      </div>
      <div>
        <div class="uni-label" style="margin-top:0">Next deadlines</div>
        ${dl.map((d) => `<div class="rdep">
          <span class="rd">${esc(parseD(d.date).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }))}<span class="ryr">${esc(d.date.slice(0, 4))}</span></span>
          <span>${esc(d.label)}</span>
          <span class="rleft" title="${d.approx ? 'approximate date' : ''}">${d.approx ? '≈ ' : ''}${d.daysLeft === 0 ? 'today' : d.daysLeft + ' d'}</span>
        </div>`).join('') || '<div class="rnote">No dated deadlines ahead.</div>'}
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h2>Today on your route</h2>
      <span class="pill">${c.totalMinutes} min</span>
    </div>
    <div class="hint">${esc(routeMode(c))}. Tick what you finish; the list refills from your plan.</div>
    ${c.items.map(routeTodayRow).join('') || '<div class="empty">Nothing open for today — everything due by this stage is ticked.</div>'}
    ${doneToday.length ? `<div class="uni-label">Done today</div>
      ${doneToday.map((it) => routeRow(it.id, esc(it.kind === 'course' ? `Work on: ${it.text}` : it.text))).join('')}` : ''}
  </div>

  <div class="rtabs" role="group" aria-label="Route sections">
    ${TABS.map(([k, l]) => `<button class="rtab" data-rtab="${k}" aria-pressed="${routeTab === k}">${l}</button>`).join('')}
  </div>
  <div class="card">${(body[routeTab] || routeTimeline)(P, pr)}</div>`;
};

function routeTimeline(P, pr) {
  const si = pr.stage.index;
  const active = (ph) => (ph.tasks || []).filter((t) => R.isActive(t.tags || []));
  const tags = [...new Set(P.phases.flatMap((ph) => active(ph).flatMap((t) => t.tags || [])))];
  const tag = tags.includes(routeTag) ? routeTag : '';
  return `<div class="row" style="gap:6px;margin-bottom:10px">
      ${['', ...tags].map((t) => `<button class="rfilter" data-rtag="${esc(t)}" aria-pressed="${tag === t}">${t ? esc(TAG_NAMES[t] || t) : 'All'}</button>`).join('')}
    </div>
    <div>${P.phases.map((ph, i) => {
      const tasks = active(ph), shown = tag ? tasks.filter((t) => (t.tags || []).includes(tag)) : tasks;
      if (tag && !shown.length) return '';
      return `<div class="rphase${i === si ? ' now' : ''}" id="rphase-${esc(ph.id)}">
        <div>
          <div class="rstation">${esc(ph.station)}</div>
          <div class="rwhenbig">${esc(ph.when || '')}</div>
          <div class="rwhenbig">${tasks.filter((t) => R.isDone(t.id)).length} of ${tasks.length} done</div>
          ${i === si ? '<span class="rhere">you are here</span>' : ''}
        </div>
        <div>
          ${ph.why ? `<p class="uni-p" style="margin-bottom:6px">${esc(ph.why)}</p>` : ''}
          ${shown.map((t) => routeRow(t.id, esc(t.text), `<span class="rtags">${rTags(t.tags || [])}${
            t.cost ? `<span class="rtag cost">${esc(t.cost)}</span>` : ''}${t.critical ? '<span class="rtag bad">critical</span>' : ''}</span>${
            t.note ? `<span class="rnote">${esc(t.note)}</span>` : ''}`, { crit: t.critical })).join('') || '<div class="rnote">No tasks in this stage.</div>'}
        </div>
      </div>`;
    }).join('')}</div>`;
}

function routeReqs(P, pr) {
  const count = Object.fromEntries(pr.reqs.map((r) => [r.id, r]));
  return `<div class="hint">What each university asks for. Grades show your live prediction from the Uni tab.</div>
    <div class="grid g2">${P.unis.map((u) => {
      const k = count[u.id];
      return `<div class="uni-card${k.active ? '' : ' rdim'}">
        <div class="row" style="justify-content:space-between;align-items:baseline">
          <h3 style="font-size:15px">${esc(u.name)}</h3>
          <span class="chip">${k.done}/${k.total}</span>
        </div>
        <div style="color:var(--text-muted);font-size:12.5px">${esc([u.prog, u.verdict].filter(Boolean).join(' · '))}</div>
        ${k.active ? '' : `<p class="uni-p" style="color:var(--serious);margin-top:6px">Dropped: you switched off
          ${u.keep === 'mit' ? 'MIT' : 'the UK applications'} above. Its boxes still tick; they just stop counting.</p>`}
        <div style="margin-top:6px">${u.items.map((it) => routeRow(it.id, esc(it.text),
          Array.isArray(it.req) ? `<span class="rnote">${gradeGapHtml(gradeGap(it.req[0], it.req[1]))}</span>` : '')).join('')}</div>
        ${u.money ? `<div class="rmoney">${esc(u.money)}</div>` : ''}
      </div>`;
    }).join('') || '<div class="rnote">No universities in the plan.</div>'}</div>`;
}

function routePortfolio(P, pr) {
  const info = Object.fromEntries(pr.projects.map((x) => [x.id, x]));
  const WORD = { done: ['good', '✓ done'], 'in-progress': ['warn', 'in progress'], 'not-started': ['', 'not started'], later: ['', 'later'] };
  const station = (id) => P.phases.find((ph) => ph.id === id)?.station;
  const card = (x) => {
    const p = info[x.id], [cls, word] = WORD[p.status];
    return `<div class="rproj${x.mini ? '' : ' flag'}">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <span class="rkind">${esc(x.kind || (x.mini ? 'Mini project' : 'Flagship project'))}</span>
        <span class="status ${cls}" style="${cls ? '' : 'color:var(--text-muted)'}">${word}</span>
      </div>
      <h3 style="font-size:16px;margin-top:4px">${esc(x.name)}</h3>
      <div class="rmeta">${x.cost ? `<span class="rtag cost">${esc(x.cost)}</span>` : ''}${
        station(x.start) ? `<span class="rtag">starts: ${esc(station(x.start))}</span>` : ''}</div>
      ${x.pitch ? `<p class="uni-p">${esc(x.pitch)}</p>` : ''}
      ${x.why ? `<p class="uni-p" style="color:var(--text-muted)">${esc(x.why)}</p>` : ''}
      <div class="row" style="gap:10px;margin:10px 0 4px;flex-wrap:nowrap">
        <div class="hbar" style="flex:1"><span style="width:${p.pct}%;background:var(--s1)"></span></div>
        <span class="num" style="font-size:12px;color:var(--text-muted)">${p.done}/${p.total}</span>
      </div>
      ${(x.steps || []).map((s) => {
        const next = p.next?.id === s.id;
        return routeRow(s.id, esc(s.text), next ? '<span class="rtags"><span class="rtag next">next</span></span>' : '', { cls: next ? ' next' : '' });
      }).join('')}
    </div>`;
  };
  const flag = P.projects.filter((x) => !x.mini), mini = P.projects.filter((x) => x.mini);
  return (flag.length ? `<div class="uni-label" style="margin-top:0">Flagship projects</div>${flag.map(card).join('')}` : '')
    + (mini.length ? `<div class="uni-label">Mini projects</div><div class="grid g2">${mini.map(card).join('')}</div>` : '')
    || '<div class="rnote">No projects in the plan.</div>';
}

function routeCourses(P, pr) {
  const CERT = { free: 'free certificate', paid: 'paid certificate' };
  const known = new Set(P.phases.map((ph) => ph.id));
  const groups = [...P.phases.map((ph) => [ph.station + (ph.when ? ' · ' + ph.when : ''), P.courses.filter((x) => x.phase === ph.id)]),
    ['Any time', P.courses.filter((x) => !known.has(x.phase))]].filter(([, cs]) => cs.length);
  return `<div class="hint">${pr.courses.done} of ${pr.courses.total} done · core ${pr.courses.core.done} of ${pr.courses.core.total}.
      Core courses feed the plan directly; extras are for when there is time.</div>
    ${groups.map(([label, cs]) => `<div class="uni-label">${esc(label)}</div>
      ${cs.map((x) => routeRow(x.id, rLink(x.url, esc(x.name)) || esc(x.name), `<span class="rtags">
          <span class="rtag${x.core === false ? '' : ' next'}">${x.core === false ? 'extra' : 'core'}</span>
          <span class="rtag${x.cert === 'paid' ? ' cost' : ''}">${CERT[x.cert] || 'no certificate'}</span></span>
        <span class="rnote">${esc([x.by, x.when, x.feeds && 'feeds ' + x.feeds].filter(Boolean).join(' · '))}${
          x.certNote ? `<br>${esc(x.certNote)}` : ''}</span>`)).join('')}`).join('') || '<div class="rnote">No courses in the plan.</div>'}`;
}

function routeEarn(P, pr) {
  const info = Object.fromEntries(pr.earn.map((e) => [e.id, e]));

function applyRouteOpts(o) {
  S.routeOpts = R.opts();
  for (const k of ['uk', 'mit']) if (typeof o?.[k] === 'boolean') S.routeOpts[k] = o[k];
}

/* Accepts a bare plan, {plan, done, opts}, or the old planner's export
   {keepUK, keepMIT, items:[{id, done}]} — ticks only, applied to the plan you have.
   Validated before anything is written; a real plan is replaced only on a second click. */
function importRoute(text) {
  const say = (html, bad = false) => {
    $('#routeMsg').innerHTML = bad ? `<span style="color:var(--critical)">${html}</span>` : html;
  };
  const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
  let x;
  try { x = JSON.parse(text); } catch { return say('That is not valid JSON.', true); }
  if (!isObj(x)) return say('That is not a route plan.', true);
  if (text.length > 400000) return say('That plan is too large (400 KB at most).', true);
  const today = todayISO();

  if (!x.plan && !x.phases && Array.isArray(x.items)) {
    if (!R.plan()) return say('That file only holds ticks. Import the plan first, then this.', true);
    const known = new Set(R.items().map((it) => it.id));
    let n = 0;
    mutate(() => {
      S.routeDone ||= {};
      for (const it of x.items) if (it?.done && known.has(it.id) && !S.routeDone[it.id]) { S.routeDone[it.id] = today; n++; }
      applyRouteOpts({ uk: x.keepUK, mit: x.keepMIT });
    });
    return say(`<span style="color:var(--good)">Applied ${n} tick${n === 1 ? '' : 's'} to your plan.</span>`);
  }

  const plan = x.plan || x;
  if (!isObj(plan) || !Array.isArray(plan.phases) || !plan.phases.length) {
    return say('A route plan needs a list of stages (<code>phases</code>).', true);
  }
  const T = createRoute(() => ({ route: plan }));
  const v = T.validate();
  if (v.duplicates.length) return say(`Not imported — the plan uses these ids twice: <b>${esc(v.duplicates.join(', '))}</b>.`, true);
  if (v.badPhaseRefs.length) return say(`Not imported — these items point at stages that do not exist: <b>${
    esc(v.badPhaseRefs.map((b) => `${b.id} → ${b.phase}`).join(', '))}</b>.`, true);
  const cur = R.plan();
  if (cur && !cur._example && routePending !== text) {
    routePending = text;
    return say(`<b>This replaces your plan “${esc(cur.name || 'Your route')}”.</b> Ticks stay wherever the ids match.
      Click Import again to go ahead.`);
  }
  routePending = null;

  const known = new Set(T.items().map((it) => it.id));
  const d = x.plan ? x.done : null;
  // ticks: {id: date} as exported here (dates kept), a list of ids, or the old planner's {items}
  const ticks = Array.isArray(d) ? d.map((id) => [id])
    : Array.isArray(d?.items) ? d.items.filter((i) => i?.done).map((i) => [i.id])
    : isObj(d) ? Object.entries(d) : [];
  let n = 0;
  mutate(() => {
    S.route = plan;
    S.routeDone ||= {};
    for (const [id, when] of ticks) {
      if (!known.has(id) || S.routeDone[id]) continue;
      S.routeDone[id] = /^\d{4}-\d{2}-\d{2}$/.test(when || '') ? when : today;
      n++;
    }
    const o = x.opts || (typeof d?.keepUK === 'boolean' || typeof d?.keepMIT === 'boolean' ? { uk: d.keepUK, mit: d.keepMIT } : null);
    if (o) applyRouteOpts(o);
  });
  say(`<span style="color:var(--good)">Imported “${esc(plan.name || 'your plan')}”: ${plan.phases.length} stages,
    ${known.size} items${n ? `, ${n} tick${n === 1 ? '' : 's'} added` : ''}.</span>${
    v.warnings.length ? `<br>${esc(v.warnings.join('; '))}` : ''}`);
}

function exportRoute() {
  const out = $('#routeOut');
  out.value = JSON.stringify({ plan: S.route, done: S.routeDone || {}, opts: R.opts() }, null, 2);
  out.hidden = false; $('#routeCopy').hidden = false;
  out.select();
}

async function loadConfigUI() {
  const c = await (await fetch('/api/config')).json();
  const put = (id, v, secret) => {
    const el = $(id); if (!el) return;
    if (secret) { el.value = ''; el.placeholder = v.set ? `saved (${v.hint}) — type to replace` : el.placeholder; }
    else el.value = v || '';
  };
  put('#cfgNotionToken', c.notion.token, true);
  put('#cfgClientId', c.classroom.client_id, false);
  if ($('#cfgIcal')) $('#cfgIcal').value = (c.classroom.icalUrls || []).join('\n');
  put('#cfgClientSecret', c.classroom.client_secret, true);
  put('#cfgGoodnotesFolder', c.goodnotes.folder, false);
}

async function saveConfig(section, btn) {
  const fields = {
    notion:    { token: '#cfgNotionToken' },
    classroom: { client_id: '#cfgClientId', client_secret: '#cfgClientSecret', icalUrls: '#cfgIcal' },
    goodnotes: { folder: '#cfgGoodnotesFolder' },
  }[section];
  const patch = {};
  for (const [key, sel] of Object.entries(fields)) {
    const v = $(sel)?.value ?? '';
    if (v !== '') patch[key] = v;          // blank means "leave what's saved alone"
  }
  if (!Object.keys(patch).length) { btn.textContent = 'nothing to save'; setTimeout(() => btn.textContent = 'Save', 1400); return; }
  await fetch('/api/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ [section]: patch }) });
  btn.textContent = 'Saved ✓';
  setTimeout(() => { btn.textContent = 'Save'; }, 1600);
  await loadConfigUI();
  await loadIntegrationStatus();
}

  const done = () => { const was = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = was; }, 1400); };

    const range = document.createRange(); range.selectNodeContents(btn.previousElementSibling || btn);

  });
}

      a + Object.values(next.timetable?.[w] || {}).reduce((b, d) => b + d.length, 0), 0);
    msg.innerHTML = `<b>This replaces everything currently in the dashboard.</b><br>
      The file holds ${next.topics.length} topics, ${next.homework?.length || 0} homework,
      ${next.papers?.length || 0} papers, ${next.sessions?.length || 0} sessions and
      ${lessons} timetabled lessons. Click Import again to go ahead.`;
    return;
  }
  importPending = null;
  S = next;
  save();
  renderAll();
  msg.innerHTML = '<span style="color:var(--good)">Imported.</span>';
}

// Read exported calendar files and offer what is in them as homework.
async function importICS(files) {
  const out = $('#icsOut');
  out.innerHTML = '<div class="empty">Reading…</div>';
  const all = [];
  for (const f of files) {
    const text = await f.text();
    try {
      const r = await (await fetch('/api/ics', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, name: f.name.replace(/\.ics$/i, '') }),
      })).json();
      if (r.items) all.push(...r.items);
    } catch { /* skip a file we cannot read rather than failing the batch */ }
  }
  if (!all.length) {
    out.innerHTML = '<div class="empty">No dated assignments in those files.</div>';
    return;
  }
  const today = todayISO();
  const future = all.filter((x) => x.due >= today);
  out.innerHTML = `<table>
    <thead><tr><th>Course</th><th>Assignment</th><th>Due</th><th></th></tr></thead>
    <tbody>${future.slice(0, 40).map((w) => `<tr>
      <td style="color:var(--text-secondary)">${esc(w.course)}</td>
      <td>${esc(w.title)}</td>
      <td style="white-space:nowrap">${esc(fmtDay(w.due))}</td>
      <td><button class="btn sm" data-import='${esc(JSON.stringify({ t: w.title, d: w.due }))}'>Add</button></td>
    </tr>`).join('')}</tbody></table>
    <div class="hint" style="margin-top:10px">${future.length} upcoming of ${all.length} total.</div>`;
}
